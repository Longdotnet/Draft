name: Apply bot menu session-reference fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-bot-menu-session-reference.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch numeric menu routing with session references
        shell: python
        run: |
          from pathlib import Path

          intelligence = Path('server/VolleyDraft.Api/Services/ZaloBotIntelligence.cs')
          text = intelligence.read_text(encoding='utf-8')

          old = '    private static readonly Regex ExactCommandRegex = new("^(?:[1-9]|10|12)$", RegexOptions.Compiled | RegexOptions.CultureInvariant);\n'
          new = old + '''    private static readonly Regex MenuCommandWithSessionReferenceRegex = new(\n        @"^(?:(?:@?[a-z0-9._-]*bot|npc|volley\\s*bot)\\s+)?(?<command>9|10)(?:\\s+(?<reference>.+))?$",\n        RegexOptions.Compiled | RegexOptions.CultureInvariant);\n'''
          if old not in text:
              raise SystemExit('ExactCommandRegex anchor not found')
          text = text.replace(old, new, 1)

          old = '''    public static bool TryGetExactCommand(string value, out int command)\n    {\n        var normalized = Normalize(value);\n        if (ExactCommandRegex.IsMatch(normalized) && int.TryParse(normalized, out command)) return true;\n        command = 0;\n        return false;\n    }\n'''
          new = old + '''\n    /// <summary>\n    /// Parses deterministic numeric menu commands while allowing commands 9 and 10\n    /// to carry an explicit session reference such as "T4", "CN" or "2/9".\n    /// The optional bot prefix is accepted because inbound Zalo payloads can expose\n    /// either the mention-stripped question or the original visible content.\n    /// </summary>\n    public static bool TryGetMenuCommand(string value, out int command, out string? sessionReference)\n    {\n        sessionReference = null;\n        var normalized = Normalize(value);\n        if (TryGetExactCommand(normalized, out command)) return true;\n\n        var match = MenuCommandWithSessionReferenceRegex.Match(normalized);\n        if (!match.Success || !int.TryParse(match.Groups["command"].Value, out command))\n        {\n            command = 0;\n            return false;\n        }\n\n        var reference = match.Groups["reference"].Value.Trim();\n        sessionReference = reference.Length == 0 ? null : reference;\n        return true;\n    }\n'''
          if old not in text:
              raise SystemExit('TryGetExactCommand anchor not found')
          text = text.replace(old, new, 1)

          old = '''        if (TryGetExactCommand(q, out var command))\n            return new(IntentForCommand(command), 1, null, false, null, "exact_numeric_command");'''
          new = '''        if (TryGetMenuCommand(q, out var command, out var menuSessionReference))\n            return new(\n                IntentForCommand(command),\n                1,\n                menuSessionReference,\n                false,\n                null,\n                menuSessionReference is null ? "exact_numeric_command" : "numeric_command_with_session_reference");'''
          if old not in text:
              raise SystemExit('ClassifyDeterministically anchor not found')
          text = text.replace(old, new, 1)
          intelligence.write_text(text, encoding='utf-8')

          overbook = Path('server/VolleyDraft.Api/Services/ZaloOverbookReminder.cs')
          text = overbook.read_text(encoding='utf-8')
          old = '                                ZaloBotIntelligence.TryGetExactCommand(incoming.Content, out _);'
          new = '                                ZaloBotIntelligence.TryGetMenuCommand(incoming.Content, out _, out _);'
          if old not in text:
              raise SystemExit('Overbook exact-command precedence anchor not found')
          text = text.replace(old, new, 1)
          overbook.write_text(text, encoding='utf-8')

          test = Path('server/VolleyDraft.Api.Tests/ZaloBotMenuSessionReferenceTests.cs')
          test.write_text('''using VolleyDraft.Api.Services;\n\nnamespace VolleyDraft.Api.Tests;\n\npublic sealed class ZaloBotMenuSessionReferenceTests\n{\n    [Theory]\n    [InlineData("9 T4", 9, "t4", ZaloBotIntent.AutoDraft)]\n    [InlineData("10 T4", 10, "t4", ZaloBotIntent.TeamImage)]\n    [InlineData("10 CN", 10, "cn", ZaloBotIntent.TeamImage)]\n    [InlineData("10 2/9", 10, "2/9", ZaloBotIntent.TeamImage)]\n    [InlineData("@bot 10 T4", 10, "t4", ZaloBotIntent.TeamImage)]\n    public void Numeric_menu_command_can_carry_session_reference(\n        string input,\n        int expectedCommand,\n        string expectedReference,\n        ZaloBotIntent expectedIntent)\n    {\n        Assert.True(ZaloBotIntelligence.TryGetMenuCommand(input, out var command, out var reference));\n        Assert.Equal(expectedCommand, command);\n        Assert.Equal(expectedReference, reference);\n\n        var decision = ZaloBotIntelligence.ClassifyDeterministically(input);\n        Assert.Equal(expectedIntent, decision.Intent);\n        Assert.Equal(expectedReference, decision.SessionReference);\n        Assert.Equal("numeric_command_with_session_reference", decision.Reason);\n    }\n\n    [Theory]\n    [InlineData("10")]\n    [InlineData("9")]\n    public void Existing_exact_numeric_commands_keep_their_contract(string input)\n    {\n        Assert.True(ZaloBotIntelligence.TryGetExactCommand(input, out _));\n        Assert.True(ZaloBotIntelligence.TryGetMenuCommand(input, out _, out var reference));\n        Assert.Null(reference);\n        Assert.Equal("exact_numeric_command", ZaloBotIntelligence.ClassifyDeterministically(input).Reason);\n    }\n\n    [Theory]\n    [InlineData("10abc")]\n    [InlineData("10 team 1")]\n    [InlineData("8 T4")]\n    public void Non_supported_numeric_suffixes_do_not_become_menu_commands(string input)\n    {\n        Assert.False(ZaloBotIntelligence.TryGetMenuCommand(input, out _, out _));\n    }\n}\n''', encoding='utf-8')

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run regression tests
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj --configuration Release

      - name: Commit validated fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-bot-menu-session-reference.yml
          git add server/VolleyDraft.Api/Services/ZaloBotIntelligence.cs \
                  server/VolleyDraft.Api/Services/ZaloOverbookReminder.cs \
                  server/VolleyDraft.Api.Tests/ZaloBotMenuSessionReferenceTests.cs
          git commit -m "fix: support session refs for bot 9 and 10"
          git push origin main
