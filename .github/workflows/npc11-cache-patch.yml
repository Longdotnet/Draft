name: NPC11 cache patch

on:
  push:
    branches:
      - agent/npc11-volleyverse

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/npc11-volleyverse
          fetch-depth: 0
      - name: Separate AI and fallback cache keys
        shell: python
        run: |
          from pathlib import Path
          p = Path("server/VolleyDraft.Api/Services/Npc11/Npc11CardService.cs")
          s = p.read_text()
          old = '''        var fileName = $"npc11-{cacheHash[..24]}.png";

        var cached = await db.ZaloBotImageAssets.AsNoTracking()
            .Where(asset => asset.AdminUserId == connection.AdminUserId && asset.FileName == fileName)
            .OrderByDescending(asset => asset.CreatedAt)
            .Select(asset => new { asset.Id })
            .FirstOrDefaultAsync(cancellationToken);
        if (cached is not null)
        {
            return new Npc11CardResult(
                BuildMessage(profile, aiArtUsed: true, cached: true),
                BuildPublicImageUrl(cached.Id),
                true,
                true);
        }

        var aiArt = await TryGenerateAiArtAsync(profile, avatarBytes, provider, cancellationToken);
        var hero = aiArt ?? avatarBytes;
'''
          new = '''        var aiFileName = $"npc11-ai-{cacheHash[..24]}.png";
        var fallbackFileName = $"npc11-fallback-{cacheHash[..24]}.png";
        var aiRequested = ShouldAttemptAi(avatarBytes);
        var preferredFileName = aiRequested ? aiFileName : fallbackFileName;

        var cached = await FindCachedAssetAsync(connection.AdminUserId, preferredFileName, cancellationToken);
        if (cached is not null)
        {
            return new Npc11CardResult(
                BuildMessage(profile, aiArtUsed: aiRequested, cached: true),
                BuildPublicImageUrl(cached),
                aiRequested,
                true);
        }

        var aiArt = aiRequested
            ? await TryGenerateAiArtAsync(profile, avatarBytes, provider, cancellationToken)
            : null;
        var hero = aiArt ?? avatarBytes;
        var usedAi = aiArt is { Length: > 0 };
        var finalFileName = usedAi ? aiFileName : fallbackFileName;
        if (!usedAi && aiRequested)
        {
            // Retry the AI worker on future calls, but reuse one deterministic fallback
            // asset while the worker is offline instead of inserting duplicates.
            var fallbackId = await FindCachedAssetAsync(connection.AdminUserId, fallbackFileName, cancellationToken);
            if (fallbackId is not null)
                return new Npc11CardResult(BuildMessage(profile, false, true), BuildPublicImageUrl(fallbackId), false, true);
        }
'''
          assert s.count(old) == 1, "cache block anchor changed"
          s = s.replace(old, new)
          s = s.replace('            FileName = fileName,', '            FileName = finalFileName,', 1)
          s = s.replace('        var usedAi = aiArt is { Length: > 0 };\n        logger.LogInformation(', '        logger.LogInformation(', 1)
          anchor = '''    private async Task<byte[]?> TryGenerateAiArtAsync(
'''
          helper = '''    private bool ShouldAttemptAi(byte[]? referenceBytes)
    {
        if (!configuration.GetValue("Npc11:AiEnabled", false) || referenceBytes is not { Length: > 0 }) return false;
        var baseUrl = configuration["Npc11:ArtWorkerBaseUrl"]?.TrimEnd('/');
        return Uri.TryCreate(baseUrl, UriKind.Absolute, out var uri) && uri.Scheme is "http" or "https";
    }

    private async Task<string?> FindCachedAssetAsync(string adminUserId, string fileName, CancellationToken cancellationToken) =>
        await db.ZaloBotImageAssets.AsNoTracking()
            .Where(asset => asset.AdminUserId == adminUserId && asset.FileName == fileName)
            .OrderByDescending(asset => asset.CreatedAt)
            .Select(asset => asset.Id)
            .FirstOrDefaultAsync(cancellationToken);

'''
          assert s.count(anchor) == 1, "helper anchor changed"
          s = s.replace(anchor, helper + anchor)
          p.write_text(s)
      - name: Commit cache fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Longdotnet"
          git config user.email "189841499+Longdotnet@users.noreply.github.com"
          git add server/VolleyDraft.Api/Services/Npc11/Npc11CardService.cs
          git commit -m "fix: retry NPC11 AI after fallback cache"
          git push origin HEAD:agent/npc11-volleyverse
