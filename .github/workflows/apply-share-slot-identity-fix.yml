name: Apply share-slot identity fix

on:
  push:
    branches:
      - fix/share-slot-identity-binding

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/share-slot-identity-binding
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Apply identity consistency guards and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          bot_path = Path('server/VolleyDraft.Api/Services/ZaloBotService.cs')
          bot = bot_path.read_text(encoding='utf-8')

          participant_pattern = re.compile(r'''        var participantInputs = partners\.Select\(\(partnerName, index\) =>\n        \{\n            var commandPartnerId = command\.PartnerZaloUserIds is \{ Count: > 0 \} && index < command\.PartnerZaloUserIds\.Count\n                \? command\.PartnerZaloUserIds\[index\]\n                : null;\n            var mention = FindMentionedUser\(partnerName, mentionedUsers\);\n            var mentionId = commandPartnerId \?\? mention\?\.ZaloUserId;\n            var normalizedMentionId = NormalizeId\(mentionId \?\? string\.Empty\);\n            var existing = normalizedMentionId\.Length > 0 && session\.PlayerNamesByZaloUserId\.TryGetValue\(normalizedMentionId, out var mentionedPartnerName\)\n                \? mentionedPartnerName\n                : ResolvePlayerReference\(partnerName, session\.PlayerNames\);\n            mentionedMembers\.TryGetValue\(NormalizeId\(mentionId \?\? string\.Empty\), out var member\);\n            var displayName = existing \?\? \(NormalizeText\(partnerName\) == "ban"\n                \? NextExternalShareName\(anchor, session\.PlayerNames\)\n                : partnerName\);\n            return new ShareSlotParticipantInput\(displayName, mentionId, member\?\.AvatarUrl\);\n        \}\)\.ToList\(\);''')

          participant_replacement = '''        var participantInputs = new List<ShareSlotParticipantInput>();
        for (var index = 0; index < partners.Count; index += 1)
        {
            var partnerName = partners[index];
            var commandPartnerId = command.PartnerZaloUserIds is { Count: > 0 } && index < command.PartnerZaloUserIds.Count
                ? command.PartnerZaloUserIds[index]
                : null;
            var mention = FindMentionedUser(partnerName, mentionedUsers);
            var mentionId = commandPartnerId ?? mention?.ZaloUserId;
            var normalizedMentionId = NormalizeId(mentionId ?? string.Empty);
            var identityLabel = !string.IsNullOrWhiteSpace(mention?.DisplayName)
                ? mention!.DisplayName
                : partnerName;
            var existingByUid = normalizedMentionId.Length > 0 &&
                                session.PlayerNamesByZaloUserId.TryGetValue(normalizedMentionId, out var mentionedPartnerName)
                ? mentionedPartnerName
                : null;
            if (existingByUid is not null &&
                NormalizeText(identityLabel) != NormalizeText(existingByUid))
            {
                return new BotAnswer(
                    $"Mình không ghép vì @mention '{identityLabel}' đang mang UID đã gắn với '{existingByUid}' trong {session.Name}. Dữ liệu chưa thay đổi; hãy mention lại đúng người hoặc nhờ admin sửa identity trước.",
                    null,
                    decision.Intent,
                    aiCalled,
                    ProtectedTerms: [identityLabel, existingByUid, session.Name]);
            }

            var existing = existingByUid ?? ResolvePlayerReference(partnerName, session.PlayerNames);
            mentionedMembers.TryGetValue(normalizedMentionId, out var member);
            var displayName = existing ?? (NormalizeText(partnerName) == "ban"
                ? NextExternalShareName(anchor, session.PlayerNames)
                : partnerName);
            participantInputs.Add(new ShareSlotParticipantInput(displayName, mentionId, member?.AvatarUrl));
        }'''

          bot, count = participant_pattern.subn(participant_replacement, bot, count=1)
          if count != 1:
              raise SystemExit(f'Expected one participant binding block, patched {count}')
          bot_path.write_text(bot, encoding='utf-8')

          service_path = Path('server/VolleyDraft.Api/Services/SessionDraftService.cs')
          service = service_path.read_text(encoding='utf-8')

          preview_marker = '''        foreach (var input in inputs)
        {
            var normalizedInputName = ZaloBotIntelligence.Normalize(input.DisplayName);'''
          preview_replacement = '''        foreach (var input in inputs)
        {
            if (input.ZaloUserId is not null)
            {
                var storedProfile = await db.PlayerProfiles.AsNoTracking()
                    .SingleOrDefaultAsync(profile =>
                        NormalizeZaloId(profile.ZaloUserId) == input.ZaloUserId,
                        cancellationToken);
                if (storedProfile is not null &&
                    NormalizePlayerLookup(storedProfile.DisplayName) != NormalizePlayerLookup(input.DisplayName))
                {
                    return Conflict<ShareSlotPreview>(
                        $"Xung đột định danh: @mention '{input.DisplayName}' mang UID đang thuộc hồ sơ '{storedProfile.DisplayName}'. Bot không tự ghép hoặc đổi hồ sơ.");
                }
            }

            var normalizedInputName = ZaloBotIntelligence.Normalize(input.DisplayName);'''
          if service.count(preview_marker) != 1:
              raise SystemExit(f'Expected one preview marker, found {service.count(preview_marker)}')
          service = service.replace(preview_marker, preview_replacement, 1)

          old_uid_resolution = '''            if (byZaloId.Count == 1) return new(byZaloId[0], null, false);
            return byZaloId.Count > 1
                ? new(null, "UID Zalo này đang gắn với nhiều người trong cùng trận. Admin cần kiểm tra dữ liệu trước khi cập nhật.", false)
                : allowCreateFromZaloMention
                    ? new(null, "Người được @mention chưa có trong danh sách trận này và sẽ được thêm sau khi xác nhận.", true)
                    : new(null, "Người được @mention chưa có trong danh sách trận này.", false);'''
          new_uid_resolution = '''            if (byZaloId.Count == 1)
            {
                var matched = byZaloId[0];
                var requestedName = NormalizePlayerLookup(playerReference);
                var playerName = NormalizePlayerLookup(matched.DisplayName);
                var profileName = NormalizePlayerLookup(matched.PlayerProfile?.DisplayName);
                if (requestedName.Length == 0 ||
                    requestedName != playerName ||
                    profileName.Length > 0 && requestedName != profileName)
                {
                    return new(
                        null,
                        $"Xung đột định danh: @mention '{playerReference}' mang UID đang gắn với '{matched.DisplayName}'. Bot không tự ghép hoặc ghi dữ liệu.",
                        false);
                }
                return new(matched, null, false);
            }
            if (byZaloId.Count > 1)
                return new(null, "UID Zalo này đang gắn với nhiều người trong cùng trận. Admin cần kiểm tra dữ liệu trước khi cập nhật.", false);

            var requestedReference = NormalizePlayerLookup(playerReference);
            var sameNamePlayers = players.Where(player =>
                    NormalizePlayerLookup(player.DisplayName) == requestedReference)
                .ToList();
            if (sameNamePlayers.Count > 0)
            {
                return new(
                    null,
                    $"Xung đột định danh: '{playerReference}' đã có trong trận nhưng chưa được xác minh bằng UID mention này. Bot không tự gắn UID/profile vào player chỉ vì trùng tên.",
                    false);
            }

            return allowCreateFromZaloMention
                ? new(null, "Người được @mention chưa có trong danh sách trận này và sẽ được thêm sau khi xác nhận.", true)
                : new(null, "Người được @mention chưa có trong danh sách trận này.", false);'''
          if service.count(old_uid_resolution) != 1:
              raise SystemExit(f'Expected one UID resolver block, found {service.count(old_uid_resolution)}')
          service = service.replace(old_uid_resolution, new_uid_resolution, 1)

          write_marker = '''        var addedPlayers = new List<SessionPlayer>();
        var newlyAddedNames = new List<string>();
        foreach (var input in inputs)
        {
            SessionPlayer? partner = null;'''
          write_replacement = '''        var addedPlayers = new List<SessionPlayer>();
        var newlyAddedNames = new List<string>();
        foreach (var input in inputs)
        {
            if (input.ZaloUserId is not null)
            {
                var uidPlayers = sessionPlayers.Where(player =>
                        NormalizeZaloId(player.PlayerProfile?.ZaloUserId) == input.ZaloUserId)
                    .ToList();
                if (uidPlayers.Count > 1)
                    return Conflict<PreDraftSharedSlotResult>("UID Zalo này đang gắn với nhiều người trong cùng trận; đã chặn ghi share slot.");

                var uidPlayer = uidPlayers.SingleOrDefault();
                var namePlayers = sessionPlayers.Where(player =>
                        NormalizePlayerLookup(player.DisplayName) == NormalizePlayerLookup(input.DisplayName))
                    .ToList();
                if (namePlayers.Count > 1)
                    return Conflict<PreDraftSharedSlotResult>($"Tên '{input.DisplayName}' đang trùng nhiều player; đã chặn ghi share slot.");
                var namePlayer = namePlayers.SingleOrDefault();
                var profileByUid = await db.PlayerProfiles.SingleOrDefaultAsync(profile =>
                    NormalizeZaloId(profile.ZaloUserId) == input.ZaloUserId);

                if (uidPlayer is not null)
                {
                    var labelMatchesPlayer = NormalizePlayerLookup(uidPlayer.DisplayName) == NormalizePlayerLookup(input.DisplayName);
                    var labelMatchesProfile = uidPlayer.PlayerProfile is null ||
                                              NormalizePlayerLookup(uidPlayer.PlayerProfile.DisplayName) == NormalizePlayerLookup(input.DisplayName);
                    if (!labelMatchesPlayer || !labelMatchesProfile)
                    {
                        return Conflict<PreDraftSharedSlotResult>(
                            $"Xung đột định danh: @mention '{input.DisplayName}' mang UID đang gắn với '{uidPlayer.DisplayName}'. Đã chặn ghi share slot.");
                    }
                    if (namePlayer is not null && namePlayer.Id != uidPlayer.Id)
                    {
                        return Conflict<PreDraftSharedSlotResult>(
                            $"Xung đột định danh: label '{input.DisplayName}' và UID đang trỏ tới hai player khác nhau. Đã chặn ghi share slot.");
                    }
                }
                else
                {
                    if (profileByUid is not null &&
                        NormalizePlayerLookup(profileByUid.DisplayName) != NormalizePlayerLookup(input.DisplayName))
                    {
                        return Conflict<PreDraftSharedSlotResult>(
                            $"Xung đột định danh: @mention '{input.DisplayName}' mang UID thuộc hồ sơ '{profileByUid.DisplayName}'. Đã chặn ghi và giữ nguyên hồ sơ.");
                    }
                    if (namePlayer is not null)
                    {
                        var namePlayerUid = NormalizeZaloId(namePlayer.PlayerProfile?.ZaloUserId);
                        if (namePlayerUid.Length == 0)
                        {
                            return Conflict<PreDraftSharedSlotResult>(
                                $"'{input.DisplayName}' đã tồn tại theo tên nhưng chưa có UID đã xác minh. Bot không tự gắn UID/profile chỉ vì trùng tên.");
                        }
                        if (namePlayerUid != input.ZaloUserId)
                        {
                            return Conflict<PreDraftSharedSlotResult>(
                                $"Xung đột định danh: '{input.DisplayName}' đang gắn với UID khác. Đã chặn ghi share slot.");
                        }
                        if (profileByUid is not null && namePlayer.PlayerProfileId != profileByUid.Id)
                        {
                            return Conflict<PreDraftSharedSlotResult>(
                                $"Xung đột định danh: label/UID/profile của '{input.DisplayName}' không cùng một identity. Đã chặn ghi share slot.");
                        }
                    }
                }
            }

            SessionPlayer? partner = null;'''
          if service.count(write_marker) != 1:
              raise SystemExit(f'Expected one pre-draft write marker, found {service.count(write_marker)}')
          service = service.replace(write_marker, write_replacement, 1)

          old_profile_mutation = '''                    else
                    {
                        profile.DisplayName = input.DisplayName;
                        if (!string.IsNullOrWhiteSpace(input.AvatarUrl))
                            profile.AvatarUrl = input.AvatarUrl;'''
          new_profile_mutation = '''                    else
                    {
                        // Identity consistency was verified above. Preserve the canonical profile label;
                        // never rename an existing UID profile from a share-slot mention.
                        if (!string.IsNullOrWhiteSpace(input.AvatarUrl))
                            profile.AvatarUrl = input.AvatarUrl;'''
          if service.count(old_profile_mutation) != 1:
              raise SystemExit(f'Expected one profile mutation block, found {service.count(old_profile_mutation)}')
          service = service.replace(old_profile_mutation, new_profile_mutation, 1)
          service_path.write_text(service, encoding='utf-8')

          test_path = Path('server/VolleyDraft.Api.Tests/ZaloShareSlotIdentityBindingTests.cs')
          test_path.write_text(r'''using Microsoft.Data.Sqlite;
using Microsoft.EntityFrameworkCore;
using VolleyDraft.Api.Data;
using VolleyDraft.Api.Models;
using VolleyDraft.Api.Services;
using Xunit;

namespace VolleyDraft.Api.Tests;

public sealed class ZaloShareSlotIdentityBindingTests
{
    [Fact]
    public async Task AnhTu_preview_cancel_then_ThanhTuyen_with_AnhTu_uid_does_not_reuse_AnhTu()
    {
        await using var connection = new SqliteConnection("Data Source=:memory:");
        await connection.OpenAsync();
        await using var db = new VolleyDraftDbContext(
            new DbContextOptionsBuilder<VolleyDraftDbContext>().UseSqlite(connection).Options);
        await db.Database.EnsureCreatedAsync();

        var admin = new User { Id = "admin", DisplayName = "Admin", Email = "admin@identity.test", PasswordHash = "x" };
        var session = new MatchSession
        {
            Id = "session",
            Name = "T6",
            AdminUserId = admin.Id,
            AdminUser = admin,
            TeamCount = 3,
            TeamSize = 6
        };
        var anchorProfile = new PlayerProfile { Id = "profile-anchor", ZaloUserId = "uid-anchor", DisplayName = "Long" };
        var anhTuProfile = new PlayerProfile { Id = "profile-anh-tu", ZaloUserId = "uid-anh-tu", DisplayName = "Anh Tú" };
        session.Players.Add(new SessionPlayer
        {
            Id = "player-anchor",
            SessionId = session.Id,
            PlayerProfileId = anchorProfile.Id,
            PlayerProfile = anchorProfile,
            DisplayName = "Long",
            IsPresent = true
        });
        session.Players.Add(new SessionPlayer
        {
            Id = "player-anh-tu",
            SessionId = session.Id,
            PlayerProfileId = anhTuProfile.Id,
            PlayerProfile = anhTuProfile,
            DisplayName = "Anh Tú",
            IsPresent = true
        });
        db.Users.Add(admin);
        db.PlayerProfiles.AddRange(anchorProfile, anhTuProfile);
        db.MatchSessions.Add(session);
        await db.SaveChangesAsync();
        db.ChangeTracker.Clear();

        var service = new SessionDraftService(db);

        // Anh Tú được preview nhưng người dùng bấm hủy: preview tuyệt đối không ghi dữ liệu.
        var anhTuPreview = await service.PreviewShareSlotAsync(
            admin.Id,
            session.Id,
            "Long",
            [new ShareSlotParticipantInput("Anh Tú", "uid-anh-tu")]);
        Assert.True(anhTuPreview.IsSuccess, anhTuPreview.Error);
        Assert.Empty(await db.DraftSlots.AsNoTracking().ToListAsync());

        // Lượt sau label là Thanh Tuyền nhưng bridge/pending payload mang nhầm UID Anh Tú.
        var thanhTuyenPreview = await service.PreviewShareSlotAsync(
            admin.Id,
            session.Id,
            "Long",
            [new ShareSlotParticipantInput("Thanh Tuyền", "uid-anh-tu")]);
        Assert.False(thanhTuyenPreview.IsSuccess);
        Assert.Contains("Xung đột định danh", thanhTuyenPreview.Error ?? string.Empty, StringComparison.OrdinalIgnoreCase);

        // Defense in depth: kể cả caller bỏ qua preview thì write path vẫn phải chặn.
        var write = await service.SharePreDraftSlotAsync(
            admin.Id,
            session.Id,
            "Long",
            [new ShareSlotParticipantInput("Thanh Tuyền", "uid-anh-tu")]);
        Assert.False(write.IsSuccess);
        Assert.Contains("Xung đột định danh", write.Error ?? string.Empty, StringComparison.OrdinalIgnoreCase);

        db.ChangeTracker.Clear();
        var anhTu = await db.SessionPlayers.AsNoTracking()
            .Include(player => player.PlayerProfile)
            .SingleAsync(player => player.Id == "player-anh-tu");
        Assert.Equal("Anh Tú", anhTu.DisplayName);
        Assert.Equal("Anh Tú", anhTu.PlayerProfile!.DisplayName);
        Assert.False(anhTu.IsInsideSharedSlot);
        Assert.Empty(await db.DraftSlots.AsNoTracking().ToListAsync());
    }

    [Fact]
    public async Task Existing_uid_profile_with_different_label_is_not_reused_or_renamed()
    {
        await using var connection = new SqliteConnection("Data Source=:memory:");
        await connection.OpenAsync();
        await using var db = new VolleyDraftDbContext(
            new DbContextOptionsBuilder<VolleyDraftDbContext>().UseSqlite(connection).Options);
        await db.Database.EnsureCreatedAsync();

        var admin = new User { Id = "admin2", DisplayName = "Admin", Email = "admin2@identity.test", PasswordHash = "x" };
        var session = new MatchSession
        {
            Id = "session2",
            Name = "CN",
            AdminUserId = admin.Id,
            AdminUser = admin,
            TeamCount = 3,
            TeamSize = 6
        };
        var anchorProfile = new PlayerProfile { Id = "profile-anchor2", ZaloUserId = "uid-anchor2", DisplayName = "Long" };
        var staleProfile = new PlayerProfile { Id = "profile-stale", ZaloUserId = "uid-stale", DisplayName = "Anh Tú" };
        session.Players.Add(new SessionPlayer
        {
            Id = "player-anchor2",
            SessionId = session.Id,
            PlayerProfileId = anchorProfile.Id,
            PlayerProfile = anchorProfile,
            DisplayName = "Long",
            IsPresent = true
        });
        db.Users.Add(admin);
        db.PlayerProfiles.AddRange(anchorProfile, staleProfile);
        db.MatchSessions.Add(session);
        await db.SaveChangesAsync();
        db.ChangeTracker.Clear();

        var service = new SessionDraftService(db);
        var result = await service.SharePreDraftSlotAsync(
            admin.Id,
            session.Id,
            "Long",
            [new ShareSlotParticipantInput("Thanh Tuyền", "uid-stale")]);

        Assert.False(result.IsSuccess);
        Assert.Contains("Xung đột định danh", result.Error ?? string.Empty, StringComparison.OrdinalIgnoreCase);
        db.ChangeTracker.Clear();
        var storedProfile = await db.PlayerProfiles.AsNoTracking().SingleAsync(profile => profile.Id == "profile-stale");
        Assert.Equal("Anh Tú", storedProfile.DisplayName);
        Assert.Single(await db.SessionPlayers.AsNoTracking().Where(player => player.SessionId == session.Id).ToListAsync());
        Assert.Empty(await db.DraftSlots.AsNoTracking().ToListAsync());
    }

    [Fact]
    public async Task Name_only_session_player_is_not_auto_bound_to_uid_profile()
    {
        await using var connection = new SqliteConnection("Data Source=:memory:");
        await connection.OpenAsync();
        await using var db = new VolleyDraftDbContext(
            new DbContextOptionsBuilder<VolleyDraftDbContext>().UseSqlite(connection).Options);
        await db.Database.EnsureCreatedAsync();

        var admin = new User { Id = "admin3", DisplayName = "Admin", Email = "admin3@identity.test", PasswordHash = "x" };
        var session = new MatchSession
        {
            Id = "session3",
            Name = "T7",
            AdminUserId = admin.Id,
            AdminUser = admin,
            TeamCount = 3,
            TeamSize = 6
        };
        var anchorProfile = new PlayerProfile { Id = "profile-anchor3", ZaloUserId = "uid-anchor3", DisplayName = "Long" };
        var thanhTuyenProfile = new PlayerProfile { Id = "profile-thanh-tuyen", ZaloUserId = "uid-thanh-tuyen", DisplayName = "Thanh Tuyền" };
        session.Players.Add(new SessionPlayer
        {
            Id = "player-anchor3",
            SessionId = session.Id,
            PlayerProfileId = anchorProfile.Id,
            PlayerProfile = anchorProfile,
            DisplayName = "Long",
            IsPresent = true
        });
        session.Players.Add(new SessionPlayer
        {
            Id = "manual-thanh-tuyen",
            SessionId = session.Id,
            DisplayName = "Thanh Tuyền",
            IsPresent = true
        });
        db.Users.Add(admin);
        db.PlayerProfiles.AddRange(anchorProfile, thanhTuyenProfile);
        db.MatchSessions.Add(session);
        await db.SaveChangesAsync();
        db.ChangeTracker.Clear();

        var service = new SessionDraftService(db);
        var result = await service.SharePreDraftSlotAsync(
            admin.Id,
            session.Id,
            "Long",
            [new ShareSlotParticipantInput("Thanh Tuyền", "uid-thanh-tuyen")]);

        Assert.False(result.IsSuccess);
        Assert.Contains("không tự gắn UID/profile", result.Error ?? string.Empty, StringComparison.OrdinalIgnoreCase);
        db.ChangeTracker.Clear();
        var manual = await db.SessionPlayers.AsNoTracking().SingleAsync(player => player.Id == "manual-thanh-tuyen");
        Assert.Null(manual.PlayerProfileId);
        Assert.False(manual.IsInsideSharedSlot);
        Assert.Empty(await db.DraftSlots.AsNoTracking().ToListAsync());
    }
}
''', encoding='utf-8')
          PY

      - name: Run identity regression tests
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --filter FullyQualifiedName~ZaloShareSlotIdentityBindingTests

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-share-slot-identity-fix.yml
          git add server/VolleyDraft.Api/Services/ZaloBotService.cs \
                  server/VolleyDraft.Api/Services/SessionDraftService.cs \
                  server/VolleyDraft.Api.Tests/ZaloShareSlotIdentityBindingTests.cs
          git commit -m "fix: guard share-slot identity binding"
          git push origin HEAD:fix/share-slot-identity-binding
