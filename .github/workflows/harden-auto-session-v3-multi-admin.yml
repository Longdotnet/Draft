name: Harden Auto Session V3 multi-admin routing

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  harden-routing:
    if: ${{ github.head_ref == 'agent/auto-session-conversation-v3' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auto-session-conversation-v3
          fetch-depth: 0

      - name: Apply multi-admin ownership routing and baseline test fix
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('server/VolleyDraft.Api/Services/ZaloAutoSessionConversationService.cs')
          lines = service.read_text().splitlines()

          # Fix the quote-addressing block with explicit braces.
          quote_i = next(i for i, line in enumerate(lines) if 'var quotedMessageId = incoming.Quote?.MessageId?.Trim();' in line)
          indent = lines[quote_i][:len(lines[quote_i]) - len(lines[quote_i].lstrip())]
          expected = [
              'var quotedMessageId = incoming.Quote?.MessageId?.Trim();',
              'var stronglyAddressed = incoming.MentionedBot;',
              'if (!string.IsNullOrWhiteSpace(quotedMessageId))',
              'conversation = await conversations.FindByQuotedBotMessageAsync(groupId, quotedMessageId, cancellationToken);',
              'stronglyAddressed = stronglyAddressed || conversation is not null;'
          ]
          actual = [lines[quote_i].strip(), lines[quote_i + 1].strip(), lines[quote_i + 2].strip(), lines[quote_i + 3].strip(), lines[quote_i + 4].strip()]
          if actual != expected:
              raise SystemExit(f'quoted-message routing block unexpected: {actual!r}')
          lines[quote_i:quote_i + 5] = [
              indent + 'var quotedMessageId = incoming.Quote?.MessageId?.Trim();',
              indent + 'var stronglyAddressed = incoming.MentionedBot;',
              indent + 'if (!string.IsNullOrWhiteSpace(quotedMessageId))',
              indent + '{',
              indent + '    conversation = await conversations.FindByQuotedBotMessageAsync(groupId, quotedMessageId, cancellationToken);',
              indent + '    stronglyAddressed = stronglyAddressed || conversation is not null;',
              indent + '}'
          ]

          # Replace the first organizer authorization block in TryHandleIncomingAsync.
          organizer_i = next(i for i, line in enumerate(lines) if 'var organizerIds = GetOrganizerIds(roles);' in line)
          draft_i = next(i for i in range(organizer_i + 1, len(lines)) if 'var draft = DeserializeDraft(conversation.DraftJson);' in lines[i])
          indent = lines[organizer_i][:len(lines[organizer_i]) - len(lines[organizer_i].lstrip())]
          replacement = [
              indent + 'var organizerIds = GetOrganizerIds(roles);',
              indent + 'if (!organizerIds.Contains(senderId, StringComparer.Ordinal))',
              indent + '{',
              indent + '    // Non-organizers are bystanders for Auto Session. Do not create extra bot',
              indent + '    // chatter in a busy group merely because somebody replied to the preview.',
              indent + '    return stronglyAddressed;',
              indent + '}',
              '',
              indent + 'var activeOrganizerStillAuthorized = organizerIds.Contains(',
              indent + '    NormalizeId(conversation.ActiveOrganizerId),',
              indent + '    StringComparer.Ordinal);',
              indent + 'var organizerRoute = ZaloAutoSessionOrganizerRouting.Evaluate(',
              indent + '    senderId,',
              indent + '    NormalizeId(conversation.ActiveOrganizerId),',
              indent + '    activeOrganizerStillAuthorized,',
              indent + '    stronglyAddressed,',
              indent + '    conversation.ReminderCount >= 2,',
              indent + '    incoming.Content);',
              '',
              indent + 'if (organizerRoute == ZaloAutoSessionOrganizerRoute.IgnoreBystander)',
              indent + '    return stronglyAddressed;',
              '',
              indent + 'if (organizerRoute == ZaloAutoSessionOrganizerRoute.RejectEarlyTakeover)',
              indent + '{',
              indent + '    await SendConversationTextAsync(',
              indent + '        conversation,',
              indent + '        incoming.SenderId,',
              indent + '        incoming.SenderName,',
              indent + '        "Poll này đang có một trưởng/phó xử lý. Tui chưa chuyển quyền hội thoại để tránh hai người sửa chồng nhau. Nếu người đó im lặng, bot sẽ tự escalation; lúc đó bạn có thể reply “nhận xử lý”.",',
              indent + '        cancellationToken);',
              indent + '    return true;',
              indent + '}',
              ''
          ]
          lines[organizer_i:draft_i] = replacement

          # Explicit takeover without another edit claims ownership and shows the current draft.
          cancel_i = next(i for i, line in enumerate(lines) if 'if (interpretation.Intent == ZaloAutoSessionConversationIntent.Cancel &&' in line)
          indent = lines[cancel_i][:len(lines[cancel_i]) - len(lines[cancel_i].lstrip())]
          takeover = [
              indent + 'if (organizerRoute == ZaloAutoSessionOrganizerRoute.AllowTakeover &&',
              indent + '    ZaloAutoSessionOrganizerRouting.IsExplicitTakeover(incoming.Content) &&',
              indent + '    interpretation.Intent is ZaloAutoSessionConversationIntent.None or ZaloAutoSessionConversationIntent.Uncertain)',
              indent + '{',
              indent + '    conversation.State = ZaloAutoSessionConversationState.Discussing;',
              indent + '    conversation.LastQuestionType = null;',
              indent + '    await conversations.SaveAsync(conversation, cancellationToken);',
              indent + '    await SendConversationTextAsync(',
              indent + '        conversation,',
              indent + '        incoming.SenderId,',
              indent + '        incoming.SenderName,',
              indent + '        BuildDraftSummary(',
              indent + '            draft,',
              indent + '            tracked,',
              indent + '            "Ok, từ giờ tui giữ poll này cho bạn xử lý. Bản nháp hiện tại như dưới đây."),',
              indent + '        cancellationToken);',
              indent + '    return true;',
              indent + '}',
              ''
          ]
          lines[cancel_i:cancel_i] = takeover
          service.write_text('\n'.join(lines) + '\n')

          # Fix a date-dependent advisor fixture: session names T6/CN must actually fall on Friday/Sunday.
          test = Path('server/VolleyDraft.Api.Tests/ZaloConversationalAdvisorTests.cs')
          text = test.read_text()
          old_t6 = 'Session("session-t6", "T6", DateTimeOffset.UtcNow.AddDays(1), zalo, longProfile, toAnProfile)'
          old_cn = 'Session("session-cn", "CN", DateTimeOffset.UtcNow.AddDays(2), zalo, longProfile, toAnProfile)'
          if old_t6 not in text or old_cn not in text:
              raise SystemExit('advisor fixture session expressions not found')
          session_pos = text.index(old_t6)
          addrange_pos = text.rfind('db.MatchSessions.AddRange(', 0, session_pos)
          if addrange_pos < 0:
              raise SystemExit('advisor MatchSessions.AddRange not found')
          line_start = text.rfind('\n', 0, addrange_pos) + 1
          line_indent = text[line_start:addrange_pos]
          text = text[:line_start] + line_indent + 'var now = DateTimeOffset.UtcNow;\n' + text[line_start:]
          text = text.replace(old_t6, 'Session("session-t6", "T6", NextWeekday(now, DayOfWeek.Friday), zalo, longProfile, toAnProfile)', 1)
          text = text.replace(old_cn, 'Session("session-cn", "CN", NextWeekday(now, DayOfWeek.Sunday), zalo, longProfile, toAnProfile)', 1)
          marker = '        private static MatchSession Session(\n'
          if marker not in text:
              raise SystemExit('advisor fixture Session helper marker not found')
          helper = '''        private static DateTimeOffset NextWeekday(DateTimeOffset from, DayOfWeek target)
          {
              var days = ((int)target - (int)from.DayOfWeek + 7) % 7;
              if (days == 0) days = 7;
              return from.AddDays(days);
          }

          '''
          text = text.replace(marker, helper + marker, 1)
          test.write_text(text)
          PY

      - name: Build backend
        run: dotnet build server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release

      - name: Run full backend tests
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-build

      - name: Commit source and remove temporary workflow
        run: |
          git config user.name "Longdotnet"
          git config user.email "longspin0220@gmail.com"
          git rm .github/workflows/harden-auto-session-v3-multi-admin.yml
          git add server/VolleyDraft.Api/Services/ZaloAutoSessionConversationService.cs \
                  server/VolleyDraft.Api/Services/ZaloAutoSessionOrganizerRouting.cs \
                  server/VolleyDraft.Api.Tests/ZaloAutoSessionOrganizerRoutingTests.cs \
                  server/VolleyDraft.Api.Tests/ZaloConversationalAdvisorTests.cs
          git commit -m "Harden Auto Session V3 multi-admin ownership"
          git push origin HEAD:agent/auto-session-conversation-v3
