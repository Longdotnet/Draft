name: Apply tournament team poster preview

on:
  push:
    branches:
      - feat/tournament-team-poster

permissions:
  contents: write

jobs:
  patch-test-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tournament-team-poster
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch team card service and tune poster
        run: python .github/scripts/patch_team_poster_service.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Run backend tests and export poster preview
        env:
          TEAM_POSTER_PREVIEW_PATH: .github/previews/team-poster-preview.png
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build frontend
        run: npm ci && npm run build
      - name: Build and test Zalo Bridge
        working-directory: zalo-bridge
        run: npm ci && npm run build && npm test
      - name: Commit validated service patch and preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/VolleyDraft.Api/Services/ZaloTeamCardService.cs server/VolleyDraft.Api/Services/TournamentTeamPosterPng.cs .github/previews/team-poster-preview.png
          git commit -m "feat: wire tournament poster into @bot 10"
          git push origin HEAD:feat/tournament-team-poster
