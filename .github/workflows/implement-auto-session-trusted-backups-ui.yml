name: Implement Auto Session trusted backups UI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  trusted-backups-ui:
    if: ${{ github.head_ref == 'agent/auto-session-conversation-v3' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auto-session-conversation-v3
          fetch-depth: 0

      - name: Apply Trusted Backup UI
        run: python patches/implement_trusted_backups_ui.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Commit UI and remove staging files
        run: |
          git config user.name "Longdotnet"
          git config user.email "longspin0220@gmail.com"
          git rm -f .github/workflows/implement-auto-session-trusted-backups-ui.yml patches/implement_trusted_backups_ui.py
          git add src/components/ZaloAutoSessionOperationsPanel.tsx
          git commit -m "Add trusted Auto Session backup controls"
          git push origin HEAD:agent/auto-session-conversation-v3
