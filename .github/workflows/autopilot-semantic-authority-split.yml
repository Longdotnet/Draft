name: Auto Session semantic authority patch

on:
  push:
    branches:
      - autopilot/auto-session-v5-semantic-authority-split

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply bounded Auto Session authority split
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          classifier = 'server/VolleyDraft.Api/Services/Zalo/Features/Poll/ZaloPollClassifierService.cs'
          replace_once(
              classifier,
              '''internal sealed record ZaloPollClassification(\n    bool IsVolleyballSignupPoll,\n    double Confidence,\n    string Reason,\n    bool UsedAi);''',
              '''internal sealed record ZaloPollClassification(\n    bool IsVolleyballSignupPoll,\n    double Confidence,\n    string Reason,\n    bool UsedAi,\n    bool SemanticCandidate = false)\n{\n    // Compatibility: IsVolleyballSignupPoll remains the deterministic mutation-authority bit.\n    // SemanticCandidate only admits a grounded poll to human review; it never authorizes mutation.\n    public bool ShouldOfferManualReview => IsVolleyballSignupPoll || SemanticCandidate;\n\n    public bool CanAutoExecute(bool requireOrganizerApproval) =>\n        IsVolleyballSignupPoll && !requireOrganizerApproval;\n}''')
          replace_once(
              classifier,
              '''            return new(false, ruleScore, $"{ruleReason};ai_suggest:{aiReason};deterministic_authority_required", true);''',
              '''            return new(\n                false,\n                ruleScore,\n                $"{ruleReason};ai_suggest:{aiReason};deterministic_authority_required",\n                true,\n                SemanticCandidate: true);''')

          legacy = 'server/VolleyDraft.Api/Services/Zalo/Features/AutoSession/ZaloAutoSessionService.cs'
          replace_once(
              legacy,
              '''        if (!classification.IsVolleyballSignupPoll)\n        {\n            proposal.Status = ZaloPollSessionProposalStatus.Ignored;\n            await store.UpsertProposalAsync(proposal, cancellationToken);\n            return;\n        }\n\n        if (!tracked.RequireOrganizerApproval)''',
              '''        if (!classification.ShouldOfferManualReview)\n        {\n            proposal.Status = ZaloPollSessionProposalStatus.Ignored;\n            await store.UpsertProposalAsync(proposal, cancellationToken);\n            return;\n        }\n\n        if (classification.CanAutoExecute(tracked.RequireOrganizerApproval))''')

          v2 = 'server/VolleyDraft.Api/Services/Zalo/Features/AutoSession/ZaloAutoSessionV2Service.cs'
          replace_once(
              v2,
              '''        if (!classification.IsVolleyballSignupPoll)\n        {\n            proposal.Status = ZaloPollSessionProposalStatus.Ignored;\n            await store.UpsertProposalAsync(proposal, cancellationToken);\n            return;\n        }''',
              '''        if (!classification.ShouldOfferManualReview)\n        {\n            proposal.Status = ZaloPollSessionProposalStatus.Ignored;\n            await store.UpsertProposalAsync(proposal, cancellationToken);\n            return;\n        }''')

          tests = 'server/VolleyDraft.Api.Tests/Zalo/Features/Poll/ZaloPollClassifierAuthorityTests.cs'
          replace_once(
              tests,
              '''        Assert.False(result.IsVolleyballSignupPoll);\n        Assert.Equal(0.66, result.Confidence, 6);\n        Assert.True(result.UsedAi);''',
              '''        Assert.False(result.IsVolleyballSignupPoll);\n        Assert.True(result.SemanticCandidate);\n        Assert.True(result.ShouldOfferManualReview);\n        Assert.False(result.CanAutoExecute(requireOrganizerApproval: false));\n        Assert.Equal(0.66, result.Confidence, 6);\n        Assert.True(result.UsedAi);''')
          replace_once(
              tests,
              '''        Assert.True(result.IsVolleyballSignupPoll);\n        Assert.Equal(0.96, result.Confidence, 6);''',
              '''        Assert.True(result.IsVolleyballSignupPoll);\n        Assert.True(result.ShouldOfferManualReview);\n        Assert.True(result.CanAutoExecute(requireOrganizerApproval: false));\n        Assert.False(result.CanAutoExecute(requireOrganizerApproval: true));\n        Assert.Equal(0.96, result.Confidence, 6);''')
          replace_once(
              tests,
              '''        Assert.False(result.IsVolleyballSignupPoll);\n        Assert.Equal(0.07, result.Confidence, 6);''',
              '''        Assert.False(result.IsVolleyballSignupPoll);\n        Assert.False(result.SemanticCandidate);\n        Assert.False(result.ShouldOfferManualReview);\n        Assert.Equal(0.07, result.Confidence, 6);''')

          skill = '.codex/skills/zalo-bot-intelligence/SKILL.md'
          replace_once(
              skill,
              '''- Do not let the model invent session IDs, player status, times, locations or slot counts.\n''',
              '''- Do not let the model invent session IDs, player status, times, locations or slot counts.\n- Do not conflate AI semantic candidacy with mutation authority. AI may nominate a grounded poll for organizer review, but only deterministic evidence or an explicit human/admin authorization path may permit Auto Session mutation.\n''')

          Path('.github/workflows/autopilot-semantic-authority-split.yml').unlink()
      - name: Targeted backend validation
        run: |
          dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj --configuration Release --filter FullyQualifiedName~ZaloPollClassifierAuthorityTests
      - name: Commit bounded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(auto-session): separate semantic review from mutation authority"
          git push origin HEAD:${GITHUB_REF_NAME}
