name: Apply Auto Session V3 patch

on:
  push:
    branches:
      - agent/auto-session-conversation-v3

permissions:
  contents: write

jobs:
  apply-v3:
    if: ${{ !contains(github.event.head_commit.message, '[v3-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auto-session-conversation-v3
          fetch-depth: 0
      - name: Unpack V3 source package
        run: |
          rm -rf /tmp/auto-session-v3
          mkdir -p /tmp/auto-session-v3
          unzip -q patches/auto-session-v3-ci.zip -d /tmp/auto-session-v3
      - name: Apply V3
        run: python /tmp/auto-session-v3/auto-session-v3-package/apply-v3.py --repo-root .
      - name: Backend tests
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj --configuration Release
      - name: Commit generated V3 source
        run: |
          git config user.name "Longdotnet"
          git config user.email "longspin0220@gmail.com"
          git add server docs
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Implement Auto Session conversation V3 [v3-generated]"
          git push origin HEAD:agent/auto-session-conversation-v3
