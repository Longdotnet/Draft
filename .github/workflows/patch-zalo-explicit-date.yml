name: Patch Zalo explicit date

on: [push, pull_request]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zalo-explicit-date-session-filter
      - name: Patch source
        run: python3 -c 'from pathlib import Path; p=Path("server/VolleyDraft.Api/Services/ZaloBotIntelligence.cs"); s=p.read_text(); old="        if (hasCalendarDate || hasRelativeDate || hasCompleteSessionName)\n            return candidates.Select(candidate => candidate.Id).ToList();\n"; new="        if (hasCalendarDate)\n            return ResolveSessionReference(q, candidates, now);\n\n        if (hasRelativeDate || hasCompleteSessionName)\n            return candidates.Select(candidate => candidate.Id).ToList();\n"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))'
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/VolleyDraft.Api/Services/ZaloBotIntelligence.cs
          git diff --cached --quiet && exit 0
          git commit -m "fix: scope explicit session dates to matching match"
          git push origin HEAD:fix/zalo-explicit-date-session-filter
