name: Poster 3 cinematic preview

on:
  push:
    branches:
      - feat/poster-03-cinematic-rework

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/poster-03-cinematic-rework

      - name: Apply Poster 3 cinematic renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('server/VolleyDraft.Api/Services/Posters/PosterRenderersBatchA.cs')
          text = target.read_text(encoding='utf-8')
          start = text.index('internal static class CyberStormPosterRenderer')
          end = text.index('internal static class MonolithBroadcastPosterRenderer')
          replacement = Path('.github/poster3-preview/CyberStormPosterRenderer.cs.txt').read_text(encoding='utf-8')
          target.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Add preview fixture
        run: cp .github/poster3-preview/Poster3CinematicPreviewTempTests.cs.txt server/VolleyDraft.Api.Tests/Poster3CinematicPreviewTempTests.cs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run backend tests and render preview
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: poster-03-cinematic-preview
          path: poster-03-cinematic-preview.png
          if-no-files-found: error

      - name: Commit validated Poster 3 source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/VolleyDraft.Api/Services/Posters/PosterRenderersBatchA.cs
          git commit -m "feat: rework poster 03 as cinematic main event"
          git push origin HEAD:feat/poster-03-cinematic-rework
