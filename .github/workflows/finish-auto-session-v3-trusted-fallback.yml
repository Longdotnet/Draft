name: Finish Auto Session V3 trusted fallback

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  trusted-fallback:
    if: ${{ github.head_ref == 'agent/auto-session-conversation-v3' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auto-session-conversation-v3
          fetch-depth: 0

      - name: Apply creator-only fallback routing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/VolleyDraft.Api/Services/ZaloAutoSessionConversationService.cs')
          lines = path.read_text().splitlines()

          # Add group-creator trust to the incoming-message organizer routing call.
          route_i = next(i for i, line in enumerate(lines)
                         if 'var organizerRoute = ZaloAutoSessionOrganizerRouting.Evaluate(' in line)
          indent = lines[route_i][:len(lines[route_i]) - len(lines[route_i].lstrip())]
          if not any('senderTrustedForTakeover' in line for line in lines[max(0, route_i - 8):route_i + 12]):
              lines[route_i:route_i] = [
                  indent + 'var trustedFallbackId = NormalizeId(roles.CreatorId);',
                  indent + 'var senderTrustedForTakeover = string.Equals(',
                  indent + '    senderId,',
                  indent + '    trustedFallbackId,',
                  indent + '    StringComparison.Ordinal);'
              ]
              route_i += 5

              active_arg_i = next(i for i in range(route_i + 1, min(len(lines), route_i + 12))
                                  if lines[i].strip() == 'activeOrganizerStillAuthorized,')
              lines.insert(active_arg_i + 1, indent + '    senderTrustedForTakeover,')

          # In follow-ups, establish a single interim trusted fallback: Zalo group creator.
          follow_method_i = next(i for i, line in enumerate(lines)
                                 if 'private async Task ProcessFollowUpsAsync' in line)
          organizers_i = next(i for i in range(follow_method_i, len(lines))
                              if 'var organizers = GetOrganizerIds(roles);' in lines[i])
          if not any('trustedFallbackId = NormalizeId(roles.CreatorId)' in line
                     for line in lines[organizers_i:organizers_i + 8]):
              count_i = next(i for i in range(organizers_i + 1, organizers_i + 6)
                             if 'if (organizers.Count == 0) continue;' in lines[i])
              follow_indent = lines[organizers_i][:len(lines[organizers_i]) - len(lines[organizers_i].lstrip())]
              lines.insert(count_i + 1, follow_indent + 'var trustedFallbackId = NormalizeId(roles.CreatorId);')

          # Replace mention-all-admins escalation with creator-only fallback, or silence if
          # there is no distinct trusted fallback. Expiry remains active independently.
          targets_i = next(i for i in range(follow_method_i, len(lines)) if lines[i].strip() == 'targets = organizers;')
          else_i = next(i for i in range(targets_i - 1, follow_method_i, -1) if lines[i].strip() == 'else')
          next_follow_i = next(i for i in range(targets_i, targets_i + 20)
                              if 'conversation.NextFollowUpAt = null;' in lines[i])
          close_i = next(i for i in range(next_follow_i + 1, next_follow_i + 5) if lines[i].strip() == '}')
          indent = lines[else_i][:len(lines[else_i]) - len(lines[else_i].lstrip())]
          body = indent + '    '
          lines[else_i:close_i + 1] = [
              indent + 'else',
              indent + '{',
              body + '// Interim trusted-operator policy: Zalo admin alone is not enough to',
              body + '// receive/take over Auto Session. Until the explicit Trusted Backup UI',
              body + '// exists, only the current Zalo group creator is a fallback operator.',
              body + 'var fallbackAvailable =',
              body + '    trustedFallbackId.Length > 0 &&',
              body + '    organizers.Contains(trustedFallbackId, StringComparer.Ordinal) &&',
              body + '    !string.Equals(',
              body + '        trustedFallbackId,',
              body + '        NormalizeId(conversation.ActiveOrganizerId),',
              body + '        StringComparison.Ordinal);',
              '',
              body + 'conversation.ReminderCount = 2;',
              body + 'conversation.NextFollowUpAt = null;',
              body + 'if (!fallbackAvailable)',
              body + '{',
              body + '    await conversations.SaveAsync(conversation, cancellationToken);',
              body + '    continue;',
              body + '}',
              '',
              body + 'targets = [trustedFallbackId];',
              body + 'text =',
              body + '    "Poll này vẫn chưa được xử lý nên website CHƯA được tạo. " +',
              body + '    "Bạn là trưởng nhóm fallback cho Auto Session. Nếu muốn xử lý thay, hãy bấm Trả lời tin này rồi nói “nhận xử lý” hoặc nói rõ lịch cần chỉnh. " +',
              body + '    "Bot vẫn sẽ chốt lại trước khi tạo website.";',
              indent + '}'
          ]

          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Build backend
        run: dotnet build server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release

      - name: Run full backend tests
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-build

      - name: Commit source and remove temporary workflow
        run: |
          git config user.name "Longdotnet"
          git config user.email "longspin0220@gmail.com"
          git rm .github/workflows/finish-auto-session-v3-trusted-fallback.yml
          git add server/VolleyDraft.Api/Services/ZaloAutoSessionConversationService.cs
          git commit -m "Restrict Auto Session fallback to group creator"
          git push origin HEAD:agent/auto-session-conversation-v3
