name: Autopilot draft preference patch

on:
  push:
    branches:
      - autopilot/draft-preference-final-reconcile

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autopilot/draft-preference-final-reconcile
      - name: Patch final draft boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('server/VolleyDraft.Api/Services/SessionDraftService.cs')
          text = source.read_text()
          method = '    private async Task<ServiceResult<DraftStateResponse>> StartDraftRunAsync('
          anchor = '        var preferenceError = await ValidateCaptainPreferenceGroupsAsync(sessionId, teamIdByCaptainId);'
          if text.count(method) != 1:
              raise SystemExit(f'method count={text.count(method)}')
          before, after = text.split(method, 1)
          if after.count(anchor) < 1:
              raise SystemExit('StartDraftRun anchor not found')
          insertion = '        // Final mutation boundary: reconcile durable preferences against the authoritative current roster.\n        await new TeamPreferenceRosterReconciler(db).ReconcileAsync(sessionId);\n\n'
          after = after.replace(anchor, insertion + anchor, 1)
          source.write_text(before + method + after)
          Path('.github/workflows/autopilot-draft-preference-patch.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/VolleyDraft.Api/Services/SessionDraftService.cs .github/workflows/autopilot-draft-preference-patch.yml
          git commit -m "fix(draft): reconcile same-team preferences at final draft boundary"
          git push origin HEAD:autopilot/draft-preference-final-reconcile
