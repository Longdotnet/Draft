name: NPC11 v2 patch

on:
  push:
    branches:
      - agent/npc11-v2-font-ai

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/npc11-v2-font-ai
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Patch NPC11 production files
        shell: python
        run: |
          from pathlib import Path

          marker = Path("server/Npc11ArtWorker/.v2-patched")
          if marker.exists():
              print("NPC11 v2 already patched")
              raise SystemExit(0)

          renderer = Path("server/VolleyDraft.Api/Services/Npc11/Npc11VolleyVerse.cs")
          text = renderer.read_text()
          old = """    private static readonly SKTypeface Regular = FindTypeface(SKFontStyle.Normal);\n    private static readonly SKTypeface Bold = FindTypeface(SKFontStyle.Bold);"""
          new = """    private static readonly SKTypeface Regular = FindTypeface(SKFontStyle.Normal);\n    private static readonly SKTypeface Bold = FindTypeface(SKFontStyle.Bold);\n\n    internal static string SelectedFontFamily => Regular.FamilyName;"""
          assert text.count(old) == 1, "font field anchor changed"
          text = text.replace(old, new)

          old = "public static byte[] Render(Npc11CharacterProfile profile, byte[]? heroArt)"
          new = "public static byte[] Render(Npc11CharacterProfile profile, byte[]? heroArt, bool heroIsAi = false)"
          assert text.count(old) == 1, "render signature anchor changed"
          text = text.replace(old, new)
          old = "        DrawHero(canvas, heroArt);"
          new = "        DrawHero(canvas, heroArt, heroIsAi);"
          assert text.count(old) == 1, "DrawHero call anchor changed"
          text = text.replace(old, new)

          old = '''    private static void DrawHero(SKCanvas canvas, byte[]? art)\n    {\n        var rect = new SKRect(28, 28, Width - 28, 1040);\n        if (art is { Length: > 0 })\n        {\n            using var hero = SKBitmap.Decode(art);\n            if (hero is not null && hero.Width > 0 && hero.Height > 0)\n            {\n                var src = Cover(hero.Width, hero.Height, rect.Width, rect.Height);\n                using var paint = new SKPaint { IsAntialias = true, FilterQuality = SKFilterQuality.High };\n                canvas.DrawBitmap(hero, src, rect, paint);\n                return;\n            }\n        }\n\n        using var placeholder = new SKPaint\n        {\n            Shader = SKShader.CreateLinearGradient(\n                new SKPoint(rect.Left, rect.Top),\n                new SKPoint(rect.Right, rect.Bottom),\n                [new SKColor(21, 117, 74), new SKColor(5, 45, 37)],\n                null,\n                SKShaderTileMode.Clamp)\n        };\n        canvas.DrawRect(rect, placeholder);\n    }'''
          new = '''    private static void DrawHero(SKCanvas canvas, byte[]? art, bool heroIsAi)\n    {\n        var rect = new SKRect(28, 28, Width - 28, 1040);\n        if (art is { Length: > 0 })\n        {\n            using var hero = SKBitmap.Decode(art);\n            if (hero is not null && hero.Width > 0 && hero.Height > 0)\n            {\n                if (heroIsAi)\n                {\n                    var src = Cover(hero.Width, hero.Height, rect.Width, rect.Height);\n                    using var paint = new SKPaint { IsAntialias = true, FilterQuality = SKFilterQuality.High };\n                    canvas.DrawBitmap(hero, src, rect, paint);\n                }\n                else\n                {\n                    DrawFallbackAvatarHero(canvas, rect, hero);\n                }\n                return;\n            }\n        }\n\n        using var placeholder = new SKPaint\n        {\n            Shader = SKShader.CreateLinearGradient(\n                new SKPoint(rect.Left, rect.Top),\n                new SKPoint(rect.Right, rect.Bottom),\n                [new SKColor(21, 117, 74), new SKColor(5, 45, 37)],\n                null,\n                SKShaderTileMode.Clamp)\n        };\n        canvas.DrawRect(rect, placeholder);\n    }\n\n    private static void DrawFallbackAvatarHero(SKCanvas canvas, SKRect rect, SKBitmap hero)\n    {\n        // Deterministic V1 fallback: preserve the whole Zalo avatar instead of stretching/cropping\n        // a 120-160px source across the card. A blurred copy supplies atmosphere while the\n        // readable foreground portrait sits on the right, away from all text/stats.\n        var backgroundSource = Cover(hero.Width, hero.Height, rect.Width, rect.Height);\n        using (var backgroundPaint = new SKPaint\n        {\n            IsAntialias = true,\n            FilterQuality = SKFilterQuality.High,\n            ImageFilter = SKImageFilter.CreateBlur(26, 26)\n        })\n        {\n            canvas.DrawBitmap(hero, backgroundSource, rect, backgroundPaint);\n        }\n        using (var wash = new SKPaint { Color = new SKColor(1, 18, 13, 155), IsAntialias = true })\n            canvas.DrawRect(rect, wash);\n\n        var portraitArea = new SKRect(rect.Left + 475, rect.Top + 78, rect.Right - 48, rect.Bottom - 72);\n        var foreground = Contain(hero.Width, hero.Height, portraitArea);\n        var shadowRect = new SKRect(foreground.Left - 14, foreground.Top + 12, foreground.Right + 14, foreground.Bottom + 26);\n        using (var shadow = new SKPaint { Color = new SKColor(0, 0, 0, 118), IsAntialias = true })\n            canvas.DrawRoundRect(shadowRect, 24, 24, shadow);\n        using (var plate = new SKPaint { Color = new SKColor(236, 241, 226, 36), IsAntialias = true })\n            canvas.DrawRoundRect(new SKRect(foreground.Left - 8, foreground.Top - 8, foreground.Right + 8, foreground.Bottom + 8), 20, 20, plate);\n        using (var portraitPaint = new SKPaint { IsAntialias = true, FilterQuality = SKFilterQuality.High })\n            canvas.DrawBitmap(hero, new SKRect(0, 0, hero.Width, hero.Height), foreground, portraitPaint);\n        using (var border = new SKPaint\n        {\n            Color = new SKColor(210, 181, 82, 210),\n            Style = SKPaintStyle.Stroke,\n            StrokeWidth = 2.5f,\n            IsAntialias = true\n        })\n            canvas.DrawRoundRect(new SKRect(foreground.Left - 8, foreground.Top - 8, foreground.Right + 8, foreground.Bottom + 8), 20, 20, border);\n\n        DrawText(canvas, "ZALO AVATAR • AI FALLBACK", rect.Right - 58, rect.Bottom - 34, 15, new SKColor(199, 213, 190), true, SKTextAlign.Right);\n    }\n\n    private static SKRect Contain(int sourceWidth, int sourceHeight, SKRect target)\n    {\n        var scale = Math.Min(target.Width / sourceWidth, target.Height / sourceHeight);\n        var width = sourceWidth * scale;\n        var height = sourceHeight * scale;\n        return new SKRect(target.Right - width, target.MidY - height / 2f, target.Right, target.MidY + height / 2f);\n    }'''
          assert text.count(old) == 1, "DrawHero method anchor changed"
          text = text.replace(old, new)

          old = '''    private static SKTypeface FindTypeface(SKFontStyle style) =>\n        SKTypeface.FromFamilyName("DejaVu Sans", style)\n        ?? SKTypeface.FromFamilyName("Arial", style)\n        ?? SKTypeface.Default;'''
          new = '''    private static SKTypeface FindTypeface(SKFontStyle style)\n    {\n        // Render production installs Noto Sans. Prefer it explicitly because relying on\n        // Skia's default family caused Vietnamese glyphs to become square tofu boxes.\n        foreach (var family in new[] { "Noto Sans", "Noto Sans Display", "DejaVu Sans", "Arial" })\n        {\n            var typeface = SKTypeface.FromFamilyName(family, style);\n            if (typeface is not null && !string.IsNullOrWhiteSpace(typeface.FamilyName)) return typeface;\n        }\n        return SKTypeface.Default;\n    }'''
          assert text.count(old) == 1, "FindTypeface anchor changed"
          text = text.replace(old, new)
          renderer.write_text(text)

          service = Path("server/VolleyDraft.Api/Services/Npc11/Npc11CardService.cs")
          text = service.read_text()
          old = '(configuration["Npc11:ArtProvider"] ?? "flux2-klein-4b").Trim().ToLowerInvariant()'
          new = '(configuration["Npc11:ArtProvider"] ?? "qwen-image-edit-2511").Trim().ToLowerInvariant()'
          assert text.count(old) == 1, "provider anchor changed"
          text = text.replace(old, new)
          old = "var png = Npc11CardRenderer.Render(profile, hero);"
          new = "var png = Npc11CardRenderer.Render(profile, hero, usedAi);"
          assert text.count(old) == 1, "render call anchor changed"
          text = text.replace(old, new)
          old = 'var timeoutSeconds = Math.Clamp(configuration.GetValue("Npc11:ArtTimeoutSeconds", 18), 3, 45);'
          new = 'var timeoutSeconds = Math.Clamp(configuration.GetValue("Npc11:ArtTimeoutSeconds", 45), 15, 180);'
          assert text.count(old) == 1, "timeout anchor changed"
          text = text.replace(old, new)
          service.write_text(text)

          program = Path("server/VolleyDraft.Api/Program.cs")
          text = program.read_text()
          old = 'builder.Services.AddHttpClient("Npc11ArtWorker", client => client.Timeout = TimeSpan.FromSeconds(45));'
          new = 'builder.Services.AddHttpClient("Npc11ArtWorker", client => client.Timeout = TimeSpan.FromSeconds(190));'
          assert text.count(old) == 1, "worker http timeout anchor changed"
          program.write_text(text.replace(old, new))

          docker = Path("server/VolleyDraft.Api/Dockerfile")
          text = docker.read_text()
          old = '''RUN apt-get update \\\n    && apt-get install -y --no-install-recommends fonts-noto-core \\\n    && rm -rf /var/lib/apt/lists/*'''
          new = '''RUN apt-get update \\\n    && apt-get install -y --no-install-recommends fontconfig fonts-noto-core fonts-dejavu-core \\\n    && fc-cache -f \\\n    && fc-match "Noto Sans" | grep -qi "NotoSans" \\\n    && rm -rf /var/lib/apt/lists/*'''
          assert text.count(old) == 1, "Docker font anchor changed"
          docker.write_text(text.replace(old, new))

          appsettings = Path("server/VolleyDraft.Api/appsettings.json")
          text = appsettings.read_text()
          old = '''  "ZaloActivitySync": {'''
          new = '''  "Npc11": {\n    "AiEnabled": false,\n    "ArtProvider": "qwen-image-edit-2511",\n    "ArtWorkerBaseUrl": "",\n    "ArtWorkerKey": "",\n    "ArtTimeoutSeconds": 45\n  },\n  "ZaloActivitySync": {'''
          assert text.count(old) == 1, "appsettings anchor changed"
          appsettings.write_text(text.replace(old, new))

          tests = Path("server/VolleyDraft.Api.Tests/Npc11VolleyVerseTests.cs")
          text = tests.read_text()
          insert = '''\n    [Fact]\n    public void Renderer_exposes_a_real_font_family_for_vietnamese_card_copy()\n    {\n        Assert.False(string.IsNullOrWhiteSpace(Npc11CardRenderer.SelectedFontFamily));\n\n        var profile = Npc11CharacterEngine.Create("vi-font", "Đặng Thế Nguyễn", "classic");\n        var png = Npc11CardRenderer.Render(profile, null);\n        using var rendered = SKBitmap.Decode(png);\n        Assert.NotNull(rendered);\n        Assert.Equal(1080, rendered!.Width);\n        Assert.Equal(1600, rendered.Height);\n    }\n'''
          anchor = '''    [Theory]\n    [InlineData("cyberpunk", "cyber")]'''
          assert text.count(anchor) == 1, "test anchor changed"
          text = text.replace(anchor, insert + "\n" + anchor)
          tests.write_text(text)

          marker.write_text("patched\n")
      - name: Validate worker syntax
        run: python -m py_compile server/Npc11ArtWorker/app.py
      - name: Restore backend tests
        run: dotnet restore server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj
      - name: Run backend tests
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"
      - name: Commit validated patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Longdotnet"
          git config user.email "189841499+Longdotnet@users.noreply.github.com"
          git add server/VolleyDraft.Api server/VolleyDraft.Api.Tests/Npc11VolleyVerseTests.cs server/Npc11ArtWorker/.v2-patched
          git commit -m "fix(npc11): repair Vietnamese text and add AI-ready avatar fallback"
          git push origin HEAD:agent/npc11-v2-font-ai
