name: Apply staged pool storage migration

on:
  push:
    branches:
      - feat/overbook-stage-message-pools

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/overbook-stage-message-pools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration patch
        run: python .github/scripts/patch_stage_storage_migration.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Run backend tests
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build frontend
        run: npm ci && npm run build
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/VolleyDraft.Api/Services/ZaloOverbookMessageCatalog.cs server/VolleyDraft.Api/Services/ZaloOverbookService.cs server/VolleyDraft.Api/Services/ZaloOverbookReminder.cs server/VolleyDraft.Api.Tests/ZaloOverbookMessageCatalogTests.cs
          git commit -m "fix: migrate legacy reminder overrides behind staged pools"
          git push origin HEAD:feat/overbook-stage-message-pools
