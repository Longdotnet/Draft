name: Apply failed-share atomicity patch

on:
  push:
    branches:
      - fuzz/failed-share-rollback-state

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout campaign branch
        uses: actions/checkout@v4
        with:
          ref: fuzz/failed-share-rollback-state
          fetch-depth: 0

      - name: Apply transactional tracker fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/VolleyDraft.Api/Services/SessionDraftService.cs')
          text = path.read_text()
          method_start = text.index('    public async Task<ServiceResult<PreDraftSharedSlotResult>> SharePreDraftSlotAsync(')
          method_end = text.index('    public async Task<ServiceResult<IReadOnlyList<SessionPlayerResponse>>> GetPlayersAsync(', method_start)
          method = text[method_start:method_end]
          before_start = '        await using var transaction = await db.Database.BeginTransactionAsync();\n        var session = await LoadSessionForAdmin(adminUserId, sessionId).SingleOrDefaultAsync();\n'
          after_start = '        await using var transaction = await db.Database.BeginTransactionAsync();\n        var committed = false;\n        try\n        {\n            var session = await LoadSessionForAdmin(adminUserId, sessionId).SingleOrDefaultAsync();\n'
          if method.count(before_start) != 1:
              raise SystemExit(f'Expected one transaction start in SharePreDraftSlotAsync, found {method.count(before_start)}')
          method = method.replace(before_start, after_start, 1)
          before_end = '        await transaction.CommitAsync();\n        return ServiceResult<PreDraftSharedSlotResult>.Created(new(\n            anchor.DisplayName,\n            addedPlayers.Select(player => player.DisplayName).ToList(),\n            newlyAddedNames,\n            slot.DisplayName,\n            presentPlayers,\n            effectiveSlotCount,\n            incompleteNames));\n    }\n\n'
          after_end = '        await transaction.CommitAsync();\n        committed = true;\n        return ServiceResult<PreDraftSharedSlotResult>.Created(new(\n            anchor.DisplayName,\n            addedPlayers.Select(player => player.DisplayName).ToList(),\n            newlyAddedNames,\n            slot.DisplayName,\n            presentPlayers,\n            effectiveSlotCount,\n            incompleteNames));\n        }\n        finally\n        {\n            if (!committed)\n            {\n                // Database rollback/disposal does not restore EF tracked values. A rejected share\n                // may already have reactivated an absent player, enriched a profile, or tracked a\n                // new participant before a later participant fails validation. Discard the failed\n                // unit of work so a later unrelated SaveChanges cannot persist those rejected edits.\n                db.ChangeTracker.Clear();\n            }\n        }\n    }\n\n'
          if method.count(before_end) != 1:
              raise SystemExit(f'Expected one success tail in SharePreDraftSlotAsync, found {method.count(before_end)}')
          method = method.replace(before_end, after_end, 1)
          text = text[:method_start] + method + text[method_end:]
          path.write_text(text)
          PY

      - name: Run targeted failed-share fuzz regression
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --filter FullyQualifiedName~FailedShareRollbackStateFuzzTests

      - name: Remove temporary workflow and commit fix
        run: |
          rm .github/workflows/fuzz-apply-failed-share-fix.yml
          git config user.name "Draft Stateful Fuzzing Autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add server/VolleyDraft.Api/Services/SessionDraftService.cs .github/workflows/fuzz-apply-failed-share-fix.yml
          git commit -m "fix(draft): discard rejected share unit of work"
          git push origin HEAD:fuzz/failed-share-rollback-state
