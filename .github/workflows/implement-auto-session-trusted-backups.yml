name: Implement Auto Session trusted backups

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  trusted-backups:
    if: ${{ github.head_ref == 'agent/auto-session-conversation-v3' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auto-session-conversation-v3
          fetch-depth: 0

      - name: Fix helper detection and apply trusted backup backend integration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('patches/implement_trusted_backups.py')
          text = path.read_text()
          old = "if 'GetOrganizerCandidatesAsync(' not in text:"
          new = "if 'private async Task<IReadOnlyList<ZaloAutoSessionOrganizerCandidateResponse>> GetOrganizerCandidatesAsync(' not in text:"
          if old not in text:
              raise SystemExit('helper detection condition not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python patches/implement_trusted_backups.py

      - name: Build backend
        run: dotnet build server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release

      - name: Run full backend tests
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-build

      - name: Commit backend and remove staging files
        run: |
          git config user.name "Longdotnet"
          git config user.email "longspin0220@gmail.com"
          git rm .github/workflows/implement-auto-session-trusted-backups.yml patches/implement_trusted_backups.py
          git add server/VolleyDraft.Api/Services/ZaloAutoSessionConversationService.cs \
                  server/VolleyDraft.Api/Services/ZaloAutoSessionSettingsService.cs
          git commit -m "Integrate trusted Auto Session backup operators"
          git push origin HEAD:agent/auto-session-conversation-v3
