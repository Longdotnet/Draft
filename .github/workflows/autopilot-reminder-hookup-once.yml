name: Autopilot reminder hookup once

on:
  push:
    branches:
      - autopilot/reminder-exact-date-target-safety

permissions:
  contents: write

jobs:
  patch-reminder-handler:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autopilot/reminder-exact-date-target-safety
          fetch-depth: 0
      - name: Wire exact-date reminder targeting
        env:
          OLD_BLOCK_B64: 
          NEW_BLOCK_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path("server/VolleyDraft.Api/Services/ZaloBotService.cs")
          text = path.read_text(encoding="utf-8")
          old = base64.b64decode(os.environ["OLD_BLOCK_B64"]).decode("utf-8")
          new = base64.b64decode(os.environ["NEW_BLOCK_B64"]).decode("utf-8")
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one reminder target block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit production hookup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/VolleyDraft.Api/Services/ZaloBotService.cs
          git diff --cached --check
          git commit -m "fix(zalo): wire exact-date reminder targeting"
          git push origin HEAD:autopilot/reminder-exact-date-target-safety
