name: Reminder scheduler

on:
  schedule:
    - cron: "1/15 * * * *"
  workflow_dispatch:

concurrency:
  group: volley-draft-reminder-scheduler
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  tick:
    name: Wake services and verify scheduler cycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report trigger
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule || 'manual' }}"
          echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Wake Render services, queue and verify scheduler cycle
        id: scheduler
        env:
          SCHEDULER_URL: ${{ vars.SCHEDULER_URL }}
          SCHEDULER_KEY: ${{ secrets.SCHEDULER_KEY }}
          SCHEDULER_HEALTH_URL: ${{ vars.SCHEDULER_HEALTH_URL }}
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
          ZALO_BRIDGE_HEALTH_URL: ${{ vars.ZALO_BRIDGE_HEALTH_URL }}
        shell: bash
        run: |
          set -u

          echo "failure_kind=unknown" >> "$GITHUB_OUTPUT"
          echo "failure_detail=Scheduler wake/queue/verification failed without a more specific diagnosis." >> "$GITHUB_OUTPUT"

          if [ -z "$SCHEDULER_URL" ] || [ -z "$SCHEDULER_KEY" ]; then
            echo "failure_kind=configuration_missing" >> "$GITHUB_OUTPUT"
            echo "failure_detail=Actions variable SCHEDULER_URL or secret SCHEDULER_KEY is missing." >> "$GITHUB_OUTPUT"
            echo "Configure Actions variable SCHEDULER_URL and secret SCHEDULER_KEY first."
            exit 1
          fi

          # These variables are optional so the existing SCHEDULER_URL remains
          # sufficient after deployment. Set them explicitly in Actions
          # Variables when a service URL changes.
          backend_health_url="${BACKEND_HEALTH_URL:-${SCHEDULER_URL%/api/internal/scheduler/tick}/health}"
          scheduler_health_url="${SCHEDULER_HEALTH_URL:-${SCHEDULER_URL%/api/internal/scheduler/tick}/health/scheduler}"
          bridge_health_url="${ZALO_BRIDGE_HEALTH_URL:-https://draft-zalo-bridge.onrender.com/health}"

          is_render_suspended() {
            local response_file="$1"
            [ -s "$response_file" ] && grep -Eqi 'service suspended|suspended by its owner' "$response_file"
          }

          wait_for_health() {
            local name="$1"
            local url="$2"
            local response_file="/tmp/${name}-health-response"

            for attempt in 1 2 3 4; do
              status=$(curl \
                --silent \
                --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --output "$response_file" \
                --write-out "%{http_code}" \
                "$url" 2>/tmp/${name}-health-error) || status="000"

              if [ "$status" = "200" ]; then
                echo "$name is healthy: $url"
                cat "$response_file"
                echo
                return 0
              fi

              echo "$name wake attempt $attempt/4 returned HTTP $status."
              if is_render_suspended "$response_file"; then
                echo "::error::$name is suspended by its hosting owner; retries cannot wake a suspended Render service."
                return 2
              fi
              if [ -s "/tmp/${name}-health-error" ]; then
                cat "/tmp/${name}-health-error"
              fi
              sleep 5
            done

            echo "::warning::$name did not become healthy during this run: $url"
            return 1
          }

          read_scheduler_health() {
            local response_file="$1"
            curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output "$response_file" \
              --write-out "%{http_code}" \
              "$scheduler_health_url" 2>/tmp/scheduler-health-error || printf '000'
          }

          # Wake both free Render services in parallel before queueing work.
          wait_for_health "zalo-bridge" "$bridge_health_url" &
          bridge_health_pid=$!
          wait_for_health "draft-api" "$backend_health_url" &
          backend_health_pid=$!
          wait "$bridge_health_pid" || true
          wait "$backend_health_pid" || true

          suspended_services=()
          if is_render_suspended /tmp/draft-api-health-response; then
            suspended_services+=("draft-api")
          fi
          if is_render_suspended /tmp/zalo-bridge-health-response; then
            suspended_services+=("zalo-bridge")
          fi
          if [ "${#suspended_services[@]}" -gt 0 ]; then
            suspended_csv=$(IFS=,; echo "${suspended_services[*]}")
            echo "failure_kind=render_service_suspended" >> "$GITHUB_OUTPUT"
            echo "failure_detail=Render reports suspended service(s): ${suspended_csv}. Resume the service(s) in Render before scheduler verification can succeed." >> "$GITHUB_OUTPUT"
            echo "::error::Render reports suspended service(s): ${suspended_csv}. This is an owner/deployment-state blocker, not a scheduler lease or application-cycle failure."
            exit 1
          fi

          baseline_attempt=""
          baseline_success=""
          baseline_failure=""
          baseline_status=$(read_scheduler_health /tmp/scheduler-health-baseline)
          if [ "$baseline_status" = "200" ] || [ "$baseline_status" = "503" ]; then
            baseline_attempt=$(jq -r '.lastAttemptAt // empty' /tmp/scheduler-health-baseline 2>/dev/null || true)
            baseline_success=$(jq -r '.lastSuccessAt // empty' /tmp/scheduler-health-baseline 2>/dev/null || true)
            baseline_failure=$(jq -r '.lastFailureAt // empty' /tmp/scheduler-health-baseline 2>/dev/null || true)
            echo "Scheduler baseline: HTTP $baseline_status attempt=${baseline_attempt:-none} success=${baseline_success:-none} failure=${baseline_failure:-none}"
          else
            echo "Scheduler baseline unavailable: HTTP $baseline_status; verification will require a fresh healthy terminal state."
          fi

          echo "Queueing scheduler cycle: $SCHEDULER_URL"
          queued=0
          for attempt in 1 2 3 4; do
            set +e
            status=$(curl \
              --silent \
              --show-error \
              --connect-timeout 15 \
              --max-time 30 \
              --output /tmp/scheduler-response \
              --write-out "%{http_code}" \
              --request POST \
              --header "x-scheduler-key: $SCHEDULER_KEY" \
              "$SCHEDULER_URL")
            curl_exit=$?
            set -e

            if [ "$curl_exit" -eq 0 ] && [ "$status" = "202" ]; then
              cat /tmp/scheduler-response
              echo
              queued=1
              break
            fi

            if is_render_suspended /tmp/scheduler-response; then
              echo "failure_kind=render_service_suspended" >> "$GITHUB_OUTPUT"
              echo "failure_detail=Render reports the scheduler API service is suspended. Resume draft-api in Render before scheduler verification can succeed." >> "$GITHUB_OUTPUT"
              echo "::error::Scheduler API is suspended by its hosting owner; retrying cannot produce HTTP 202."
              exit 1
            fi

            echo "Scheduler attempt $attempt/4 failed: curl=$curl_exit HTTP=$status"
            cat /tmp/scheduler-response 2>/dev/null || true
            sleep 5
          done

          if [ "$queued" -ne 1 ]; then
            echo "failure_kind=scheduler_queue_failed" >> "$GITHUB_OUTPUT"
            echo "failure_detail=Scheduler endpoint did not return HTTP 202 after retries." >> "$GITHUB_OUTPUT"
            echo "Scheduler did not return HTTP 202 after 4 attempts."
            exit 1
          fi

          # HTTP 202 proves only that the trigger was accepted. Verify a fresh durable
          # terminal success after the baseline observation. A newer attempt alone is not
          # enough: it may have died after taking the lease and before recording success.
          for attempt in $(seq 1 24); do
            health_http=$(read_scheduler_health /tmp/scheduler-health-current)
            health_state=$(jq -r '.status // "unknown"' /tmp/scheduler-health-current 2>/dev/null || printf 'unknown')
            current_attempt=$(jq -r '.lastAttemptAt // empty' /tmp/scheduler-health-current 2>/dev/null || true)
            current_success=$(jq -r '.lastSuccessAt // empty' /tmp/scheduler-health-current 2>/dev/null || true)
            current_failure=$(jq -r '.lastFailureAt // empty' /tmp/scheduler-health-current 2>/dev/null || true)

            terminal_advanced=0
            if [ -n "$current_success" ] && [ "$current_success" != "$baseline_success" ]; then
              terminal_advanced=1
            fi
            attempt_advanced=0
            if [ -n "$current_attempt" ] && [ "$current_attempt" != "$baseline_attempt" ]; then
              attempt_advanced=1
            fi
            failure_advanced=0
            if [ -n "$current_failure" ] && [ "$current_failure" != "$baseline_failure" ]; then
              failure_advanced=1
            fi

            echo "Scheduler verification $attempt/24: HTTP=$health_http state=$health_state attempt=${current_attempt:-none} success=${current_success:-none} failure=${current_failure:-none}"

            if [ "$health_http" = "200" ] && [ "$health_state" = "healthy" ] && \
               [ "$terminal_advanced" -eq 1 ]; then
              echo "Scheduler cycle reached a fresh durable healthy terminal state."
              exit 0
            fi

            if [ "$health_state" = "failed" ] && \
               { [ "$failure_advanced" -eq 1 ] || [ "$attempt_advanced" -eq 1 ]; }; then
              echo "failure_kind=scheduler_cycle_failed" >> "$GITHUB_OUTPUT"
              echo "failure_detail=Scheduler recorded a fresh failed or abandoned cycle after accepting the trigger." >> "$GITHUB_OUTPUT"
              echo "Scheduler recorded a fresh failed or abandoned cycle."
              cat /tmp/scheduler-health-current
              exit 1
            fi

            sleep 5
          done

          echo "failure_kind=scheduler_cycle_timeout" >> "$GITHUB_OUTPUT"
          echo "failure_detail=Scheduler accepted the trigger but did not reach a fresh healthy terminal state within the verification window." >> "$GITHUB_OUTPUT"
          echo "Scheduler accepted the trigger but did not reach a fresh healthy terminal state within the verification window."
          cat /tmp/scheduler-health-current 2>/dev/null || true
          exit 1

      - name: Open or refresh scheduler reliability incident
        if: failure() && steps.scheduler.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_KIND: ${{ steps.scheduler.outputs.failure_kind }}
          FAILURE_DETAIL: ${{ steps.scheduler.outputs.failure_detail }}
        shell: bash
        run: |
          title="Scheduler reliability: cycle verification failed"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          failure_kind="${FAILURE_KIND:-unknown}"
          failure_detail="${FAILURE_DETAIL:-Scheduler wake/queue/verification failed without a more specific diagnosis.}"
          body=$(cat <<EOF
          The production reminder scheduler wake/queue/verification workflow failed.

          Latest failed run: ${run_url}
          Detected at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Failure kind: ${failure_kind}
          Diagnosis: ${failure_detail}

          If the failure kind is `render_service_suspended`, resume the named Render service(s) first. Application retries cannot wake a service that Render reports as suspended by its owner.

          This incident is deduplicated: repeated failures update this same open issue instead of creating notification spam. It will be closed automatically after a verified healthy scheduler cycle.
          EOF
          )

          issue_number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"${title}\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" \
            | head -n 1)

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "Updated existing scheduler incident #$issue_number."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Close recovered scheduler reliability incident
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Scheduler reliability: cycle verification failed"
          issue_number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"${title}\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" \
            | head -n 1)

          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --reason completed
            echo "Closed recovered scheduler incident #$issue_number."
          fi
