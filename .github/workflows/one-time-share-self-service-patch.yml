name: One-time share self-service patch

on:
  push:
    branches:
      - "fix/share-slot-self-service-current-voter"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/share-slot-self-service-current-voter

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Apply patch
        run: python3 .github/scripts/patch_share_self_service.py

      - name: Run backend tests
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj --configuration Release

      - name: Commit patch when changed
        run: |
          if git diff --quiet && [ ! -f server/VolleyDraft.Api.Tests/ZaloBotShareSelfServiceTests.cs ]; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/VolleyDraft.Api/Services/ZaloBotService.cs server/VolleyDraft.Api.Tests/ZaloBotShareSelfServiceTests.cs
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi
          git commit -m "fix: allow current voters to self-service share slots"
          git push origin HEAD:fix/share-slot-self-service-current-voter
