name: Autopilot PR400 patch

on:
  push:
    branches:
      - autopilot/fuzz-shared-slot-stale-race
    paths:
      - .github/workflows/autopilot-fuzz-400-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autopilot/fuzz-shared-slot-stale-race
          fetch-depth: 0
      - name: Apply systemic atomic ownership fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('server/VolleyDraft.Api/Services/SessionDraftService.cs')
          text = path.read_text(encoding='utf-8')

          old_partner = '''            if (partner.IsInsideSharedSlot && currentSlot?.Players.All(link => link.SessionPlayerId != partner.Id) != false)\n                return BadRequest<PreDraftSharedSlotResult>($"{partner.DisplayName} đang nằm trong một share slot khác.");\n            if (currentSlot?.Players.Any(link => link.SessionPlayerId == partner.Id) == true)\n                return ServiceResult<PreDraftSharedSlotResult>.Failure(StatusCodes.Status409Conflict, $"{partner.DisplayName} đã share slot với {anchor.DisplayName}.");\n            addedPlayers.Add(partner);\n'''
          new_partner = '''            if (partner.IsInsideSharedSlot && currentSlot?.Players.All(link => link.SessionPlayerId != partner.Id) != false)\n                return BadRequest<PreDraftSharedSlotResult>($"{partner.DisplayName} đang nằm trong một share slot khác.");\n            if (currentSlot?.Players.Any(link => link.SessionPlayerId == partner.Id) == true)\n                return ServiceResult<PreDraftSharedSlotResult>.Failure(StatusCodes.Status409Conflict, $"{partner.DisplayName} đã share slot với {anchor.DisplayName}.");\n\n            // Tracked SessionPlayer state can be stale across overlapping requests. Claim durable\n            // shared-slot ownership atomically instead of trusting the tracked boolean. The\n            // conditional UPDATE is the cross-request authority fence: exactly one transaction\n            // can change false -> true; losers fail closed and their transaction is rolled back.\n            if (db.Entry(partner).State != EntityState.Added)\n            {\n                var claimed = await db.SessionPlayers\n                    .Where(player => player.Id == partner.Id &&\n                                     player.SessionId == sessionId &&\n                                     !player.IsInsideSharedSlot)\n                    .ExecuteUpdateAsync(updates => updates\n                        .SetProperty(player => player.IsInsideSharedSlot, true));\n                if (claimed != 1)\n                    return Conflict<PreDraftSharedSlotResult>($"{partner.DisplayName} vừa được ghép vào share slot khác; vui lòng tải lại trạng thái.");\n\n                // ExecuteUpdate bypasses the tracker; keep the command-local entity aligned so\n                // the later SaveChanges cannot write the stale false value back.\n                partner.IsInsideSharedSlot = true;\n            }\n\n            addedPlayers.Add(partner);\n'''
          if old_partner not in text:
              raise SystemExit('partner patch anchor not found')
          text = text.replace(old_partner, new_partner, 1)

          old_anchor = '''        if (currentSlot is null)\n        {\n            slot.Players.Add(new DraftSlotPlayer\n            {\n'''
          new_anchor = '''        if (currentSlot is null)\n        {\n            // The anchor owns a shared slot too. Fence a stale/multi-instance request at the\n            // durable row before creating any slot/link rows.\n            var anchorClaimed = await db.SessionPlayers\n                .Where(player => player.Id == anchor.Id &&\n                                 player.SessionId == sessionId &&\n                                 !player.IsInsideSharedSlot)\n                .ExecuteUpdateAsync(updates => updates\n                    .SetProperty(player => player.IsInsideSharedSlot, true));\n            if (anchorClaimed != 1)\n                return Conflict<PreDraftSharedSlotResult>($"{anchor.DisplayName} vừa được ghép vào share slot khác; vui lòng tải lại trạng thái.");\n\n            anchor.IsInsideSharedSlot = true;\n            slot.Players.Add(new DraftSlotPlayer\n            {\n'''
          if old_anchor not in text:
              raise SystemExit('anchor patch anchor not found')
          text = text.replace(old_anchor, new_anchor, 1)
          path.write_text(text, encoding='utf-8')
      - name: Run targeted race regression
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj --filter FullyQualifiedName~SharedSlotStaleContextRaceFuzzTests --configuration Release
      - name: Run share-slot adjacent regressions
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj --filter "FullyQualifiedName~Share|FullyQualifiedName~SharedSlot" --configuration Release
      - name: Commit fix
        run: |
          git config user.name "Draft Stateful Fuzzing Autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add server/VolleyDraft.Api/Services/SessionDraftService.cs
          git diff --cached --check
          git commit -m "fix(fuzz): atomically claim shared-slot ownership"
          git push origin HEAD:autopilot/fuzz-shared-slot-stale-race
