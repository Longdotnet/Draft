name: NPC11 validation

on:
  push:
    branches:
      - agent/npc11-volleyverse

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore backend tests
        run: dotnet restore server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj
      - name: Run backend tests
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"
