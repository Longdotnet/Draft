name: NPC10 team image one-shot fix

on:
  push:
    branches:
      - fix/npc10-team-image-regression

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: "${{ github.event.head_commit.message != 'fix(zalo): restore @Npc 10 team image delivery' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/npc10-team-image-regression
          fetch-depth: 0

      - name: Restore NPC10 image URL delegation
        shell: python
        run: |
          from pathlib import Path

          path = Path("server/VolleyDraft.Api/Services/ZaloBotService.cs")
          text = path.read_text(encoding="utf-8")
          old = "decision.Intent == ZaloBotIntent.TeamImage && readiness?.HasTeams == true"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"Expected exactly 2 duplicated TeamImage readiness gates, found {count}")
          path.write_text(text.replace(old, "decision.Intent == ZaloBotIntent.TeamImage"), encoding="utf-8")

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore related tests
        run: dotnet restore server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj

      - name: Build related backend
        run: dotnet build server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-restore

      - name: Run NPC10 team-card regression tests
        run: >-
          dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj
          -c Release --no-build --no-restore
          --filter "FullyQualifiedName~ZaloTeamCardAvailabilityTests|FullyQualifiedName~ZaloDraftReadinessTeamResultAuthorityTests|FullyQualifiedName~ZaloTeamResultRecoveryPolicyTests|FullyQualifiedName~ZaloTeamResultRecoveryDecisionHandoffTests|FullyQualifiedName~ZaloAmbientLeaseTeamImageContinuationTests"

      - name: Commit validated regression fix
        run: |
          rm .github/workflows/npc10-team-image-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/VolleyDraft.Api/Services/ZaloBotService.cs .github/workflows/npc10-team-image-one-shot.yml
          git commit -m "fix(zalo): restore @Npc 10 team image delivery"
          git push origin HEAD:fix/npc10-team-image-regression
