name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-share-slot-fix:
    name: Finalize share-slot identity fix
    if: github.head_ref == 'fix/share-slot-identity-binding'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/share-slot-identity-binding
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Preserve verified same-name mention backfill
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/VolleyDraft.Api/Services/SessionDraftService.cs')
          text = path.read_text(encoding='utf-8')
          message = "Bot không tự attach PlayerProfile theo UID vào SessionPlayer chỉ vì trùng tên."
          message_pos = text.find(message)
          if message_pos < 0:
              raise SystemExit('post-draft guard message not found')
          start_token = 'else if (exactPartner.Count == 1)'
          start = text.rfind(start_token, 0, message_pos)
          if start < 0:
              raise SystemExit('post-draft guard start not found')
          line_start = text.rfind('\n', 0, start) + 1
          indent = text[line_start:start]
          block_end_token = '\n' + indent + '}'
          end = text.find(block_end_token, message_pos)
          if end < 0:
              raise SystemExit('post-draft guard end not found')
          end += len(block_end_token)
          replacement = f'''{start_token}
          {{
              var exactPlayer = exactPartner[0];
              var exactPlayerUid = NormalizeZaloId(exactPlayer.PlayerProfile?.ZaloUserId);
              if (exactPlayerUid.Length > 0 && exactPlayerUid != partnerZaloId)
              {{
                  return Conflict<PostDraftSharedSlotResult>(
                      $"Xung đột định danh: '{{partnerReference}}' đang gắn với UID khác. Đã chặn ghi share slot.");
              }}
              if (profileByUid is not null &&
                  exactPlayer.PlayerProfileId is not null &&
                  exactPlayer.PlayerProfileId != profileByUid.Id)
              {{
                  return Conflict<PostDraftSharedSlotResult>(
                      $"Xung đột định danh: label/UID/profile của '{{partnerReference}}' không cùng một identity. Đã chặn ghi share slot.");
              }}
              // Exact label/player match plus no conflicting UID/profile is a verified
              // backfill case. The existing write path may create or enrich that profile.
          }}'''
          replacement = '\n'.join(indent + line if index > 0 else indent + line
                                  for index, line in enumerate(replacement.splitlines()))
          text = text[:line_start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run full backend tests on final source
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release

      - name: Commit source and restore standard CI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add .github/workflows/ci.yml server/VolleyDraft.Api/Services/SessionDraftService.cs
          git commit -m "fix: preserve verified mention backfill"
          git push origin HEAD:fix/share-slot-identity-binding

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend tests
        run: dotnet restore server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj

      - name: Build backend tests
        run: dotnet build server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-restore

      - name: Test backend
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-build --no-restore

  npc11-worker:
    name: NPC11 worker syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile worker
        run: python -m py_compile server/Npc11ArtWorker/app.py

  zalo-bridge:
    name: Zalo Bridge build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/ZaloBridge/package-lock.json

      - name: Install dependencies
        working-directory: server/ZaloBridge
        run: npm ci

      - name: Build bridge
        working-directory: server/ZaloBridge
        run: npm run build

      - name: Test bridge
        working-directory: server/ZaloBridge
        run: npm test

  docker:
    name: API Docker build
    runs-on: ubuntu-latest
    needs:
      - backend
      - zalo-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t volley-draft-api:test server/VolleyDraft.Api

      - name: Build Zalo Bridge Docker image
        run: docker build -t volley-draft-zalo-bridge:test server/ZaloBridge
