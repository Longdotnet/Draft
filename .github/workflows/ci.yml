name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend tests
        run: dotnet restore server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj

      - name: Build backend tests
        run: dotnet build server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-restore

      - name: Test backend
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-build --no-restore

      - name: Guest agent conversation evals
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-build --no-restore --filter Category=GuestAgentEval

  npc11-worker:
    name: NPC11 worker syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile worker
        run: python -m py_compile server/Npc11ArtWorker/app.py

  zalo-bridge:
    name: Zalo Bridge build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/ZaloBridge/package-lock.json

      - name: Install dependencies
        working-directory: server/ZaloBridge
        run: npm ci

      - name: Build bridge
        working-directory: server/ZaloBridge
        run: npm run build

      - name: Test bridge
        working-directory: server/ZaloBridge
        run: npm test

  docker:
    name: API Docker build
    runs-on: ubuntu-latest
    needs:
      - backend
      - zalo-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t volley-draft-api:test server/VolleyDraft.Api

      - name: Build Zalo Bridge Docker image
        run: docker build -t volley-draft-zalo-bridge:test server/ZaloBridge
