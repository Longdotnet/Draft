name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  autopatch:
    name: Autopilot exact source patch
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.head.sha, 'never-match') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: autopilot/draft-pass-slot-final-gate

      - name: Patch final draft mutation guard once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("server/VolleyDraft.Api/Services/SessionDraftService.cs")
          text = path.read_text(encoding="utf-8")
          marker = "var unresolvedPassSlotCount = await new ZaloOpenSlotRiskCounter(db)"
          if marker in text:
              raise SystemExit(0)
          anchor = "        await ClearDraftRunArtifacts(sessionId);"
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one mutation anchor, found {text.count(anchor)}")
          guard = '''        if (!string.IsNullOrWhiteSpace(session.ZaloConnectionId) &&
              !string.IsNullOrWhiteSpace(session.ZaloGroupId))
          {
              var unresolvedPassSlotCount = await new ZaloOpenSlotRiskCounter(db)
                  .CountActiveForSessionAsync(
                      session.ZaloConnectionId,
                      session.ZaloGroupId,
                      session.Id);
              if (unresolvedPassSlotCount > 0)
              {
                  return Conflict<DraftStateResponse>(
                      $"Chưa thể draft vì còn {unresolvedPassSlotCount} suất đang nhường/chờ người nhận. " +
                      "Hoàn tất việc chuyển suất trước: nếu đổi ý, người nhường gõ `huỷ pass`; " +
                      "nếu đang nhận suất, người nhận vote xong rồi gõ `xong`. " +
                      "Khi NPC xác nhận xong mới gõ lại `@Npc 9`.");
              }
          }

  '''
          path.write_text(text.replace(anchor, guard + anchor), encoding="utf-8")
          PY
          if git diff --quiet -- server/VolleyDraft.Api/Services/SessionDraftService.cs; then
            exit 0
          fi
          git config user.name "Longdotnet"
          git config user.email "189841499+Longdotnet@users.noreply.github.com"
          git add server/VolleyDraft.Api/Services/SessionDraftService.cs
          git diff --cached --check
          git commit -m "fix(zalo): gate draft on unresolved pass slots [autopatch]"
          git push origin HEAD:autopilot/draft-pass-slot-final-gate

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend tests
        run: dotnet restore server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj

      - name: Build backend tests
        run: dotnet build server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-restore

      - name: Test backend
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-build --no-restore

      - name: Guest agent conversation evals
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-build --no-restore --filter Category=GuestAgentEval

  npc11-worker:
    name: NPC11 worker syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile worker
        run: python -m py_compile server/Npc11ArtWorker/app.py

  zalo-bridge:
    name: Zalo Bridge build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/ZaloBridge/package-lock.json

      - name: Install dependencies
        working-directory: server/ZaloBridge
        run: npm ci

      - name: Build bridge
        working-directory: server/ZaloBridge
        run: npm run build

      - name: Test bridge
        working-directory: server/ZaloBridge
        run: npm test

  docker:
    name: API Docker build
    runs-on: ubuntu-latest
    needs:
      - backend
      - zalo-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t volley-draft-api:test server/VolleyDraft.Api

      - name: Build Zalo Bridge Docker image
        run: docker build -t volley-draft-zalo-bridge:test server/ZaloBridge
