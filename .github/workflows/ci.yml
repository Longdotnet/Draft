name: CI

on:
  push:
    branches:
      - main
      - agent/share-slot-natural-ux
  pull_request:
    branches:
      - main

jobs:
  patch-share-slot-ux:
    if: github.ref == 'refs/heads/agent/share-slot-natural-ux'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/share-slot-natural-ux
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Apply share slot UX patch
        run: |
          python tools/share-slot-ux-patch.py
          python tools/share-slot-unshare-fix.py

      - name: Validate backend tests
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release

      - name: Commit clean code diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f .github/workflows/share-slot-ux-apply.yml tools/share-slot-ux-patch.py tools/share-slot-unshare-fix.py
          git add server/VolleyDraft.Api/Services/ZaloNaturalCommandParser.cs \
                  server/VolleyDraft.Api/Services/ZaloBotIntelligence.cs \
                  server/VolleyDraft.Api/Services/ZaloBotService.cs \
                  server/VolleyDraft.Api/Services/ZaloBotService.ShareUx.cs \
                  server/VolleyDraft.Api.Tests/ZaloShareNaturalUxTests.cs \
                  .github/workflows/ci.yml
          git commit -m "fix: make share slot self-service natural"
          git push origin HEAD:agent/share-slot-natural-ux

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend
        run: dotnet restore server/VolleyDraft.Api/VolleyDraft.Api.csproj

      - name: Build backend
        run: dotnet build server/VolleyDraft.Api/VolleyDraft.Api.csproj -c Release --no-restore

  zalo-bridge:
    name: Zalo Bridge build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/ZaloBridge/package-lock.json

      - name: Install dependencies
        working-directory: server/ZaloBridge
        run: npm ci

      - name: Build bridge
        working-directory: server/ZaloBridge
        run: npm run build

      - name: Test bridge
        working-directory: server/ZaloBridge
        run: npm test

  docker:
    name: API Docker build
    runs-on: ubuntu-latest
    needs:
      - backend
      - zalo-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t volley-draft-api:test server/VolleyDraft.Api

      - name: Build Zalo Bridge Docker image
        run: docker build -t volley-draft-zalo-bridge:test server/ZaloBridge
