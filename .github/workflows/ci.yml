name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-share-slot-fix:
    name: Apply share-slot identity fix
    if: github.head_ref == 'fix/share-slot-identity-binding'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/share-slot-identity-binding
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Apply deterministic patch
        run: python .github/apply_share_slot_identity_fix.py

      - name: Run identity regression tests
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --filter FullyQualifiedName~ZaloShareSlotIdentityBindingTests

      - name: Commit source fix and restore CI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm .github/apply_share_slot_identity_fix.py
          git rm .github/workflows/apply-share-slot-identity-fix.yml
          git rm .github/workflows/apply-share-slot-identity-fix-pr.yml
          git rm .github/workflows/apply-share-slot-identity-fix-v2.yml
          git add .github/workflows/ci.yml \
                  server/VolleyDraft.Api/Services/ZaloBotService.cs \
                  server/VolleyDraft.Api/Services/SessionDraftService.cs
          git commit -m "fix: guard share-slot identity binding"
          git push origin HEAD:fix/share-slot-identity-binding

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend tests
        run: dotnet restore server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj

      - name: Build backend tests
        run: dotnet build server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-restore

      - name: Test backend
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj -c Release --no-build --no-restore

  npc11-worker:
    name: NPC11 worker syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile worker
        run: python -m py_compile server/Npc11ArtWorker/app.py

  zalo-bridge:
    name: Zalo Bridge build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/ZaloBridge/package-lock.json

      - name: Install dependencies
        working-directory: server/ZaloBridge
        run: npm ci

      - name: Build bridge
        working-directory: server/ZaloBridge
        run: npm run build

      - name: Test bridge
        working-directory: server/ZaloBridge
        run: npm test

  docker:
    name: API Docker build
    runs-on: ubuntu-latest
    needs:
      - backend
      - zalo-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t volley-draft-api:test server/VolleyDraft.Api

      - name: Build Zalo Bridge Docker image
        run: docker build -t volley-draft-zalo-bridge:test server/ZaloBridge
