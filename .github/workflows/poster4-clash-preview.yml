name: Poster 4 clash preview

on:
  push:
    branches:
      - feat/poster-03-cinematic-rework

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Poster 4 renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/VolleyDraft.Api/Services/Posters/PosterRenderersBatchA.cs')
          text = p.read_text(encoding='utf-8')
          marker = 'internal static class MonolithBroadcastPosterRenderer'
          start = text.index(marker)
          replacement = Path('.github/poster4-preview/MonolithBroadcastPosterRenderer.cs.txt').read_text(encoding='utf-8')
          p.write_text(text[:start] + replacement + '\n', encoding='utf-8')
          PY
      - name: Add preview fixture
        run: cp .github/poster4-preview/Poster4ClashPreviewTempTests.cs.txt server/VolleyDraft.Api.Tests/Poster4ClashPreviewTempTests.cs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and render
        env:
          POSTER4_PREVIEW_PATH: ${{ github.workspace }}/poster-preview/poster-04-clash-night.png
        run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj --configuration Release --verbosity minimal
      - uses: actions/upload-artifact@v4
        with:
          name: poster-04-clash-night-validated
          path: |
            poster-preview/poster-04-clash-night.png
            server/VolleyDraft.Api/Services/Posters/PosterRenderersBatchA.cs
