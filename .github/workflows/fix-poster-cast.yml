name: Apply validated poster cast fix

on:
  push:
    branches:
      - feat/team-poster-rotation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/team-poster-rotation
      - name: Apply byte casts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/VolleyDraft.Api/Services/Posters/PosterRenderersBatchB.cs')
          text = p.read_text(encoding='utf-8')
          old = 'new SKColor(255, random.Next(80, 190), 35, random.Next(20, 95))'
          new = 'new SKColor(255, (byte)random.Next(80, 190), 35, (byte)random.Next(20, 95))'
          if new not in text:
              if old not in text:
                  raise SystemExit('Inferno cast anchor not found')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build API standalone
        run: dotnet build server/VolleyDraft.Api/VolleyDraft.Api.csproj -c Release
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/VolleyDraft.Api/Services/Posters/PosterRenderersBatchB.cs
          git commit -m "fix: cast inferno ember color channels"
          git push origin HEAD:feat/team-poster-rotation
