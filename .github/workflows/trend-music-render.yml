name: Trend music story renderer
# one-shot repair trigger: refresh the queued 2026-11-12 morning story on production

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trend-music-render.yml"
      - "scripts/trend-music/**"
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      account_id:
        description: Zalo account id
        required: false
        type: string
      group_id:
        description: Zalo group id
        required: false
        type: string
      connection_id:
        description: VolleyDraft Zalo connection id
        required: false
        type: string
      local_date:
        description: Vietnam service date
        required: false
        type: string
      idempotency_key:
        description: Stable one-send key
        required: false
        type: string
      candidates_json:
        description: Ordered licensed-media candidate array
        required: false
        type: string

concurrency:
  group: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[repair-morning-20261112]') && format('trend-music-repair-{0}', github.sha) || 'trend-music-render-worker' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Recover refreshed morning greeting
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[repair-morning-20261112]')
        shell: bash
        env:
          TREND_MUSIC_CALLBACK_KEY: ${{ secrets.TREND_MUSIC_CALLBACK_KEY || secrets.SCHEDULER_KEY }}
        run: |
          set -euo pipefail
          endpoint="https://draft-i1mq.onrender.com/api/internal/trend-music/recover-daily-greeting"
          for attempt in $(seq 1 18); do
            status="$(curl --connect-timeout 5 --max-time 20 -sS -o /tmp/recover.json -w '%{http_code}' \
              -X POST "$endpoint" \
              -H 'Content-Type: application/json' \
              -H "x-trend-music-key: ${TREND_MUSIC_CALLBACK_KEY}" \
              --data '{"groupId":"8891776946862922179","localDate":"2026-11-12","period":"morning"}' || true)"
            cat /tmp/recover.json 2>/dev/null || true
            if [[ "$status" == "200" ]]; then
              exit 0
            fi
            echo "Recovery endpoint not ready yet (HTTP ${status}, attempt ${attempt}/18)"
            sleep 10
          done
          exit 1
      - name: Ensure render dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          if ! command -v ffmpeg >/dev/null 2>&1; then
            packages+=(ffmpeg)
          fi
          if [[ ! -f /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf || ! -f /usr/share/fonts/truetype/noto/NotoSans-Bold.ttf ]]; then
            packages+=(fonts-noto-core)
          fi
          if [[ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]]; then
            packages+=(fonts-dejavu-core)
          fi
          if (( ${#packages[@]} > 0 )); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          (test -f /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf && test -f /usr/share/fonts/truetype/noto/NotoSans-Bold.ttf) || \
            (test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf && test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf)
      - name: Claim queued render and deliver story video
        if: github.event_name == 'schedule' || inputs.account_id == ''
        env:
          SCHEDULER_URL: ${{ vars.SCHEDULER_URL }}
          SCHEDULER_KEY: ${{ secrets.SCHEDULER_KEY }}
          TREND_MUSIC_CALLBACK_KEY: ${{ secrets.TREND_MUSIC_CALLBACK_KEY || secrets.SCHEDULER_KEY }}
          TREND_MUSIC_CALLBACK_URL: ${{ vars.TREND_MUSIC_CALLBACK_URL || 'https://draft-i1mq.onrender.com/api/internal/trend-music/render-complete' }}
        run: python3 scripts/trend-music/claim_and_render.py
      - name: Render direct workflow-dispatch request
        if: github.event_name == 'workflow_dispatch' && inputs.account_id != ''
        env:
          ACCOUNT_ID: ${{ inputs.account_id }}
          GROUP_ID: ${{ inputs.group_id }}
          CONNECTION_ID: ${{ inputs.connection_id }}
          LOCAL_DATE: ${{ inputs.local_date }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          CALLBACK_URL: ${{ vars.TREND_MUSIC_CALLBACK_URL || 'https://draft-i1mq.onrender.com/api/internal/trend-music/render-complete' }}
          CALLBACK_KEY: ${{ secrets.TREND_MUSIC_CALLBACK_KEY || secrets.SCHEDULER_KEY }}
          CANDIDATES_JSON: ${{ inputs.candidates_json }}
        run: python3 scripts/trend-music/render_story.py
