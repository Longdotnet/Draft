name: Trend music story renderer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trend-music-render.yml"
      - "scripts/trend-music/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      account_id:
        description: Zalo account id
        required: false
        type: string
      group_id:
        description: Zalo group id
        required: false
        type: string
      connection_id:
        description: VolleyDraft Zalo connection id
        required: false
        type: string
      local_date:
        description: Vietnam service date
        required: false
        type: string
      idempotency_key:
        description: Stable one-send key
        required: false
        type: string
      candidates_json:
        description: Ordered licensed-media candidate array
        required: false
        type: string

concurrency:
  group: trend-music-render-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg_path="$(command -v ffmpeg)"
          else
            ffmpeg_root="$RUNNER_TEMP/trend-music-ffmpeg"
            python3 -m pip install +              --disable-pip-version-check +              --no-input +              --no-deps +              --target "$ffmpeg_root" +              "imageio-ffmpeg==0.6.0"
            ffmpeg_path="$(
              PYTHONPATH="$ffmpeg_root" +                python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())'
            )"
          fi
          "$ffmpeg_path" -version | head -n 1
          echo "TREND_MUSIC_FFMPEG=$ffmpeg_path" >> "$GITHUB_ENV"
      - name: Claim queued render and deliver story video
        if: github.event_name == 'schedule' || inputs.account_id == ''
        env:
          SCHEDULER_URL: ${{ vars.SCHEDULER_URL }}
          SCHEDULER_KEY: ${{ secrets.SCHEDULER_KEY }}
          TREND_MUSIC_CALLBACK_KEY: ${{ secrets.TREND_MUSIC_CALLBACK_KEY || secrets.SCHEDULER_KEY }}
          TREND_MUSIC_CALLBACK_URL: ${{ vars.TREND_MUSIC_CALLBACK_URL || 'https://draft-i1mq.onrender.com/api/internal/trend-music/render-complete' }}
        run: python3 scripts/trend-music/claim_and_render.py
      - name: Render direct workflow-dispatch request
        if: github.event_name == 'workflow_dispatch' && inputs.account_id != ''
        env:
          ACCOUNT_ID: ${{ inputs.account_id }}
          GROUP_ID: ${{ inputs.group_id }}
          CONNECTION_ID: ${{ inputs.connection_id }}
          LOCAL_DATE: ${{ inputs.local_date }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          CALLBACK_URL: ${{ vars.TREND_MUSIC_CALLBACK_URL || 'https://draft-i1mq.onrender.com/api/internal/trend-music/render-complete' }}
          CALLBACK_KEY: ${{ secrets.TREND_MUSIC_CALLBACK_KEY || secrets.SCHEDULER_KEY }}
          CANDIDATES_JSON: ${{ inputs.candidates_json }}
        run: python3 scripts/trend-music/render_story.py
