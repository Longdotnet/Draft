name: Apply overbook banks patch
on:
  push:
    branches: [feat/overbook-message-banks-copy]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/overbook-message-banks-copy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/patch_overbook_banks.py
      - run: python .github/scripts/fix_overbook_banks.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test server/VolleyDraft.Api.Tests/VolleyDraft.Api.Tests.csproj --configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server src
          git commit -m "feat: add per-reminder overbook banks and config copy"
          git push origin HEAD:feat/overbook-message-banks-copy