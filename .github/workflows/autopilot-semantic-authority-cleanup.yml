name: Auto Session generated asset cleanup

on:
  push:
    branches:
      - autopilot/auto-session-v5-semantic-authority-split

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore unrelated generated assets
        run: |
          git fetch origin main
          git checkout origin/main -- \
            server/VolleyDraft.Api/Assets/SocialCards/Night/night-card-01.b64 \
            server/VolleyDraft.Api/Assets/SocialCards/Night/night-card-02.b64 \
            server/VolleyDraft.Api/Assets/SocialCards/Night/night-card-03.b64 \
            server/VolleyDraft.Api/Assets/SocialCards/Night/night-card-04.b64 \
            server/VolleyDraft.Api/Assets/SocialCards/Night/night-card-05.b64 \
            server/VolleyDraft.Api/Assets/SocialCards/social-card-01.b64 \
            server/VolleyDraft.Api/Assets/SocialCards/social-card-02.b64 \
            server/VolleyDraft.Api/Assets/SocialCards/social-card-03.b64 \
            server/VolleyDraft.Api/Assets/SocialCards/social-card-04.b64
          rm .github/workflows/autopilot-semantic-authority-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(auto-session): remove unrelated generated asset drift"
          git push origin HEAD:${GITHUB_REF_NAME}
